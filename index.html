<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌌 نوفا سوشيال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0e17;
  --bg-elev:#11151f;
  --card:#151a26;
  --line:rgba(255,255,255,0.08);
  --primary:#5b6cff;
  --primary-deep:#3d47c9;
  --accent:#22d3ee;
  --like:#f5488a;
  --text-main:#eef0f7;
  --text-dim:#8b93a7;
  --danger:#f0435f;
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  color:var(--text-main);
  font-family:'Tajawal',sans-serif;
  min-height:100vh;
  padding-bottom:76px;
}
body.app-active{padding-bottom:76px;}
h1,h2,h3,.brand,.auth-title,.section-title{font-family:'Cairo',sans-serif;}
button,input,textarea{font-family:'Tajawal',sans-serif;}
::selection{background:var(--primary);color:#fff;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
img{max-width:100%;display:block;}

/* ---------- Offline banner ---------- */
#offline-banner{
  display:none;position:sticky;top:0;z-index:60;
  background:linear-gradient(90deg,var(--danger),#a3283f);
  color:#fff;text-align:center;font-size:12.5px;padding:9px 14px;
}
#offline-banner.show{display:block;}

/* ---------- Top header (in-app) ---------- */
#top-header{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;
  background:rgba(11,14,23,0.85);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.brand{font-weight:800;font-size:18px;background:linear-gradient(90deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,0.03);color:var(--text-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;}

#app{max-width:640px;margin:0 auto;position:relative;}
#screen-body{padding:16px 14px 30px;}

/* ---------- AUTH SCREEN ---------- */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 18px;}
.auth-card{
  width:100%;max-width:400px;
  background:linear-gradient(165deg, var(--card), var(--bg-elev));
  border:1px solid var(--line);border-radius:24px;padding:34px 26px;
  box-shadow:0 24px 60px rgba(0,0,0,0.45);
  text-align:center;
}
.auth-logo{font-size:44px;margin-bottom:10px;}
.auth-title{font-weight:800;font-size:24px;color:var(--text-main);}
.auth-sub{color:var(--text-dim);font-size:13.5px;margin-top:4px;margin-bottom:22px;}
.auth-tabs{display:flex;background:rgba(255,255,255,0.04);border-radius:14px;padding:4px;margin-bottom:20px;}
.auth-tab{flex:1;padding:10px;border:none;background:none;color:var(--text-dim);font-weight:700;font-size:13.5px;border-radius:10px;cursor:pointer;transition:all .2s ease;}
.auth-tab.active{background:linear-gradient(135deg,var(--primary),var(--primary-deep));color:#fff;}
.auth-form{display:flex;flex-direction:column;gap:14px;text-align:right;}
.auth-error{color:var(--danger);font-size:12.5px;min-height:14px;text-align:center;}
.auth-note{margin-top:16px;font-size:11px;color:var(--text-dim);line-height:1.7;}

/* ---------- Form fields (shared) ---------- */
.form-field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;font-weight:600;}
.form-field input, .form-field textarea{
  width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;color:var(--text-main);font-size:14px;outline:none;transition:border-color .15s ease;
}
.form-field textarea{min-height:70px;resize:vertical;}
.form-field input:focus, .form-field textarea:focus{border-color:var(--primary);}
.primary-btn{
  width:100%;padding:13px;border-radius:12px;border:none;
  background:linear-gradient(135deg,var(--primary),var(--primary-deep));
  color:#fff;font-weight:700;font-size:14.5px;cursor:pointer;transition:transform .15s ease, opacity .15s ease;
}
.primary-btn:active{transform:scale(0.98);}
.primary-btn:disabled{opacity:0.6;}

/* ---------- Feed screen ---------- */
.composer-teaser{
  display:flex;align-items:center;gap:12px;
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:14px 16px;margin-bottom:18px;cursor:pointer;transition:border-color .15s ease;
}
.composer-teaser:hover{border-color:var(--primary);}
.teaser-text{flex:1;color:var(--text-dim);font-size:14px;}
.teaser-icon{font-size:16px;}

.mini-avatar{
  width:42px;height:42px;border-radius:50%;flex-shrink:0;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  color:#fff;font-weight:800;font-size:16px;
}
.mini-avatar img{width:100%;height:100%;object-fit:cover;}
.mini-avatar.small{width:30px;height:30px;font-size:12px;}

.posts-list{display:flex;flex-direction:column;gap:14px;}
.post-card{
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;
  animation:cardIn .25s ease;
}
@keyframes cardIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.post-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.post-head-text{flex:1;}
.post-author{font-weight:700;font-size:14px;color:var(--text-main);}
.post-time{font-size:11.5px;color:var(--text-dim);margin-top:1px;}
.post-delete-btn{background:none;border:none;color:var(--text-dim);font-size:14px;cursor:pointer;padding:4px;}
.post-delete-btn:hover{color:var(--danger);}
.post-content{font-size:14.5px;line-height:1.9;color:var(--text-main);white-space:pre-wrap;word-break:break-word;}
.post-image{margin-top:12px;border-radius:14px;overflow:hidden;border:1px solid var(--line);max-height:420px;}
.post-image img{width:100%;height:100%;object-fit:cover;}
.post-actions{display:flex;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);}
.post-action{
  display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:none;
  background:rgba(255,255,255,0.03);color:var(--text-dim);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s ease;
}
.post-action:hover{background:rgba(255,255,255,0.06);}
.like-btn[data-liked="1"]{color:var(--like);}
.comments-section{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);}
.comments-list{display:flex;flex-direction:column;gap:10px;max-height:260px;overflow-y:auto;margin-bottom:10px;}
.comment-row{display:flex;gap:8px;align-items:flex-start;}
.comment-bubble{background:rgba(255,255,255,0.04);border-radius:12px;padding:8px 12px;flex:1;}
.comment-author{font-size:12px;font-weight:700;color:var(--text-main);}
.comment-text{font-size:13px;color:var(--text-dim);margin-top:2px;line-height:1.6;}
.comment-form{display:flex;gap:8px;}
.comment-form input{flex:1;background:rgba(255,255,255,0.04);border:1px solid var(--line);border-radius:20px;padding:9px 14px;color:var(--text-main);font-size:13px;outline:none;}
.comment-form button{padding:9px 16px;border-radius:20px;border:none;background:var(--primary);color:#fff;font-size:12.5px;font-weight:700;cursor:pointer;}

.empty-state{text-align:center;color:var(--text-dim);font-size:13.5px;padding:50px 20px;border:1px dashed var(--line);border-radius:16px;}

/* ---------- Profile screen ---------- */
.profile-card{text-align:center;padding:20px 0 26px;}
.profile-avatar-big{
  width:84px;height:84px;border-radius:50%;margin:0 auto 12px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  color:#fff;font-weight:800;font-size:30px;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);
}
.profile-avatar-big img{width:100%;height:100%;object-fit:cover;}
.profile-username{color:var(--text-dim);font-size:13.5px;}
.profile-form{display:flex;flex-direction:column;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:24px;}
.section-title{font-weight:800;font-size:15px;margin-bottom:12px;color:var(--text-main);}
.logout-btn{width:100%;margin-top:20px;padding:13px;border-radius:12px;border:1px solid rgba(240,67,95,0.35);background:rgba(240,67,95,0.08);color:var(--danger);font-weight:700;font-size:14px;cursor:pointer;}

/* ---------- Bottom tab bar ---------- */
.tab-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  padding:8px 6px calc(6px + env(safe-area-inset-bottom));
  background:rgba(11,14,23,0.92);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  max-width:640px;margin:0 auto;
}
.tab-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;
  background:none;border:none;color:var(--text-dim);font-size:10.5px;cursor:pointer;border-radius:12px;transition:color .15s ease;
}
.tab-item .tab-ic{font-size:20px;}
.tab-item.active{color:var(--primary);}
.tab-item.compose-tab .tab-ic{
  background:linear-gradient(135deg,var(--primary),var(--accent));
  width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;
  margin:-16px auto 0;box-shadow:0 6px 18px rgba(91,108,255,0.5);
}

/* ---------- Modal system ---------- */
.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(4,6,12,0.75);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s ease;}
@media(min-width:640px){.modal-overlay{align-items:center;padding:20px;}}
.modal-overlay.show{opacity:1;pointer-events:all;}
.modal{
  width:100%;max-width:480px;background:linear-gradient(165deg, var(--card), var(--bg-elev));
  border:1px solid var(--line);border-radius:24px 24px 0 0;padding:22px 20px 26px;
  position:relative;transform:translateY(30px);transition:transform .3s cubic-bezier(.2,.9,.25,1.1);
  max-height:90vh;overflow-y:auto;
}
@media(min-width:640px){.modal{border-radius:22px;transform:translateY(18px) scale(0.97);}}
.modal-overlay.show .modal{transform:translateY(0) scale(1);}
.modal-close{position:absolute;top:16px;left:16px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.06);border:1px solid var(--line);color:var(--text-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;}
.modal-title{text-align:center;font-family:'Cairo',sans-serif;font-weight:800;font-size:18px;margin-bottom:18px;}
.composer-form{display:flex;flex-direction:column;gap:14px;}
#composer-content{min-height:110px;}
.composer-preview{display:none;width:100%;border-radius:14px;margin-top:4px;max-height:220px;object-fit:cover;border:1px solid var(--line);}

.toast{
  position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#1a1f2e;border:1px solid var(--primary);color:var(--text-main);
  padding:11px 18px;border-radius:12px;font-size:13px;z-index:200;opacity:0;
  transition:opacity .25s ease, transform .25s ease;pointer-events:none;text-align:center;max-width:88vw;
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div id="offline-banner">📶 أنت غير متصل بالإنترنت — النشر والتفاعل يحتاجان اتصالاً فعّالاً</div>
<div id="app"></div>

<!-- BOTTOM TAB BAR (visible once logged in, controlled by body.app-active) -->
<nav class="tab-bar" id="main-tabbar" style="display:none;">
  <button class="tab-item" data-tab="feed"><span class="tab-ic">🏠</span>الرئيسية</button>
  <button class="tab-item compose-tab" data-tab="compose"><span class="tab-ic">➕</span></button>
  <button class="tab-item" data-tab="profile"><span class="tab-ic">👤</span>حسابي</button>
</nav>

<!-- COMPOSER MODAL -->
<div class="modal-overlay" id="composer-modal">
  <div class="modal">
    <div class="modal-close" data-close>✕</div>
    <div class="modal-title">منشور جديد</div>
    <form id="composer-form" class="composer-form">
      <div class="form-field">
        <textarea id="composer-content" placeholder="بم تفكر الآن؟" maxlength="1000"></textarea>
      </div>
      <div class="form-field">
        <label>رابط صورة (اختياري)</label>
        <input type="text" id="composer-image-url" placeholder="https://...">
        <img id="composer-preview" class="composer-preview">
      </div>
      <button type="submit" class="primary-btn" id="composer-submit-btn">نشر</button>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
/* ============================================================
   ⚡ منصة التواصل الاجتماعي — Firebase Auth + Firestore
   ============================================================ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  onAuthStateChanged, signOut, updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, doc, setDoc, getDoc, updateDoc, deleteDoc,
  addDoc, query, orderBy, limit, onSnapshot, serverTimestamp,
  where, getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCfPtxGjvMhlR0vOILq1PXajM3V5Xgnxsc",
  authDomain: "modz-aec01.firebaseapp.com",
  projectId: "modz-aec01",
  storageBucket: "modz-aec01.firebasestorage.app",
  messagingSenderId: "828089759139",
  appId: "1:828089759139:web:c2829c23d461ee81d89616"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ------------------------------------------------------------
   STATE
   ------------------------------------------------------------ */
let currentUser = null;      // firebase auth user object
let currentProfile = null;   // profile doc data { username, displayName, avatarUrl, bio }
let feedUnsub = null;
let currentTab = "feed";
let composerImagePreview = "";

/* ------------------------------------------------------------
   UTIL
   ------------------------------------------------------------ */
function $(sel) { return document.querySelector(sel); }
function $id(id) { return document.getElementById(id); }
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function timeAgo(ts) {
  if (!ts) return "الآن";
  const date = ts.toDate ? ts.toDate() : new Date(ts);
  const diff = Math.floor((Date.now() - date.getTime()) / 1000);
  if (diff < 60) return "الآن";
  if (diff < 3600) return `منذ ${Math.floor(diff / 60)} د`;
  if (diff < 86400) return `منذ ${Math.floor(diff / 3600)} س`;
  if (diff < 2592000) return `منذ ${Math.floor(diff / 86400)} يوم`;
  return date.toLocaleDateString("ar-EG");
}
function showToast(msg) {
  const t = $id("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove("show"), 2600);
}
function setLoading(btn, loading, labelDefault) {
  if (loading) { btn.disabled = true; btn.dataset.label = btn.textContent; btn.textContent = "..."; }
  else { btn.disabled = false; btn.textContent = labelDefault || btn.dataset.label || btn.textContent; }
}
function avatarFallback(name) {
  return (name || "؟").trim().charAt(0).toUpperCase();
}
function updateOnlineBanner() {
  const b = $id("offline-banner");
  if (!navigator.onLine) b.classList.add("show"); else b.classList.remove("show");
}
window.addEventListener("online", updateOnlineBanner);
window.addEventListener("offline", updateOnlineBanner);

/* ------------------------------------------------------------
   AUTH SCREEN
   ------------------------------------------------------------ */
let authMode = "login"; // or "signup"

function renderAuthScreen() {
  const root = $id("app");
  root.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-logo">🌌</div>
        <h1 class="auth-title">نوفا سوشيال</h1>
        <p class="auth-sub">مساحتك للتعبير والتواصل</p>

        <div class="auth-tabs">
          <button class="auth-tab ${authMode === "login" ? "active" : ""}" data-mode="login">تسجيل الدخول</button>
          <button class="auth-tab ${authMode === "signup" ? "active" : ""}" data-mode="signup">حساب جديد</button>
        </div>

        <form id="auth-form" class="auth-form">
          <div class="form-field" id="field-username" style="display:${authMode === "signup" ? "block" : "none"}">
            <label>اسم المستخدم</label>
            <input type="text" id="auth-username" placeholder="مثال: sara_2026" ${authMode === "signup" ? "required" : ""}>
          </div>
          <div class="form-field">
            <label>البريد الإلكتروني</label>
            <input type="email" id="auth-email" placeholder="you@example.com" required>
          </div>
          <div class="form-field">
            <label>كلمة المرور</label>
            <input type="password" id="auth-password" placeholder="••••••••" required minlength="6">
          </div>
          <p class="auth-error" id="auth-error"></p>
          <button type="submit" class="primary-btn" id="auth-submit-btn">
            ${authMode === "login" ? "دخول" : "إنشاء الحساب"}
          </button>
        </form>
        <p class="auth-note">بالمتابعة أنت توافق على الالتزام بآداب المجتمع داخل المنصة.</p>
      </div>
    </div>
  `;

  root.querySelectorAll(".auth-tab").forEach(t => {
    t.addEventListener("click", () => { authMode = t.dataset.mode; renderAuthScreen(); });
  });

  $id("auth-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = $id("auth-email").value.trim();
    const password = $id("auth-password").value;
    const username = authMode === "signup" ? $id("auth-username").value.trim().toLowerCase().replace(/[^a-z0-9_\.]/g, "") : "";
    const errBox = $id("auth-error");
    const btn = $id("auth-submit-btn");
    errBox.textContent = "";

    if (!navigator.onLine) { errBox.textContent = "لا يوجد اتصال بالإنترنت — يرجى تفعيل الإنترنت والمحاولة مجددًا."; return; }

    setLoading(btn, true);
    try {
      if (authMode === "signup") {
        if (!username || username.length < 3) throw { message: "اسم المستخدم لازم يكون 3 حروف على الأقل (حروف إنجليزية/أرقام)." };
        // ensure username unique
        const q = query(collection(db, "users"), where("username", "==", username));
        const existing = await getDocs(q);
        if (!existing.empty) throw { message: "اسم المستخدم ده مستخدم بالفعل، اختر اسم تاني." };

        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(cred.user, { displayName: username });
        await setDoc(doc(db, "users", cred.user.uid), {
          username, displayName: username, avatarUrl: "", bio: "",
          createdAt: serverTimestamp()
        });
        showToast("تم إنشاء الحساب بنجاح 🎉");
      } else {
        await signInWithEmailAndPassword(auth, email, password);
        showToast("أهلاً بعودتك 👋");
      }
    } catch (err) {
      errBox.textContent = translateAuthError(err);
      setLoading(btn, false, authMode === "login" ? "دخول" : "إنشاء الحساب");
    }
  });
}

function translateAuthError(err) {
  const msg = (err && err.message) || "";
  if (msg) return msg;
  const code = err && err.code;
  const map = {
    "auth/email-already-in-use": "هذا البريد الإلكتروني مستخدم بالفعل.",
    "auth/invalid-email": "صيغة البريد الإلكتروني غير صحيحة.",
    "auth/weak-password": "كلمة المرور ضعيفة، يجب أن تكون 6 أحرف على الأقل.",
    "auth/user-not-found": "لا يوجد حساب بهذا البريد الإلكتروني.",
    "auth/wrong-password": "كلمة المرور غير صحيحة.",
    "auth/invalid-credential": "بيانات الدخول غير صحيحة.",
    "auth/network-request-failed": "تعذر الاتصال — تأكد أن الإنترنت مفعّل لديك."
  };
  return map[code] || "حدث خطأ غير متوقع، حاول مرة أخرى.";
}

/* ------------------------------------------------------------
   MAIN APP SHELL (after auth)
   ------------------------------------------------------------ */
function renderShell() {
  const root = $id("app");
  root.innerHTML = `
    <div id="top-header">
      <div class="brand">🌌 نوفا سوشيال</div>
      <div class="header-actions">
        <button id="header-notice-btn" class="icon-btn" title="الشبكة">📶</button>
      </div>
    </div>
    <div id="screen-body"></div>
  `;
  paintTab(currentTab);
  $id("header-notice-btn").addEventListener("click", () => {
    showToast(navigator.onLine ? "أنت متصل بالإنترنت ✅" : "لا يوجد اتصال بالإنترنت حاليًا 📶");
  });
}

function paintTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".tab-item").forEach(t => t.classList.toggle("active", t.dataset.tab === tab));
  const body = $id("screen-body");
  if (!body) return;
  body.innerHTML = "";
  if (feedUnsub) { feedUnsub(); feedUnsub = null; }

  if (tab === "feed") body.appendChild(renderFeedScreen());
  else if (tab === "profile") body.appendChild(renderProfileScreen());
}

document.addEventListener("click", (e) => {
  const tabBtn = e.target.closest(".tab-item");
  if (tabBtn) {
    if (tabBtn.dataset.tab === "compose") { openComposer(); return; }
    paintTab(tabBtn.dataset.tab);
  }
});

/* ------------------------------------------------------------
   FEED SCREEN
   ------------------------------------------------------------ */
function renderFeedScreen() {
  const wrap = el("div", "feed-screen");
  wrap.innerHTML = `
    <div class="composer-teaser" id="composer-teaser">
      <div class="mini-avatar">${currentProfile && currentProfile.avatarUrl ? `<img src="${escapeHtml(currentProfile.avatarUrl)}">` : avatarFallback(currentProfile && currentProfile.displayName)}</div>
      <div class="teaser-text">بم تفكر الآن؟</div>
      <div class="teaser-icon">✏️</div>
    </div>
    <div id="posts-list" class="posts-list"></div>
    <div id="feed-empty" class="empty-state" style="display:none;">لا توجد منشورات بعد — كن أول من ينشر! ✨</div>
  `;
  wrap.querySelector("#composer-teaser").addEventListener("click", openComposer);

  const listEl = wrap.querySelector("#posts-list");
  const emptyEl = wrap.querySelector("#feed-empty");
  const q = query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(60));
  feedUnsub = onSnapshot(q, (snap) => {
    listEl.innerHTML = "";
    if (snap.empty) { emptyEl.style.display = "block"; return; }
    emptyEl.style.display = "none";
    snap.forEach(docSnap => listEl.appendChild(renderPostCard(docSnap.id, docSnap.data())));
  }, (err) => {
    console.error(err);
    emptyEl.style.display = "block";
    emptyEl.textContent = "تعذر تحميل المنشورات — تأكد من اتصالك بالإنترنت.";
  });

  return wrap;
}

function renderPostCard(postId, post) {
  const card = el("div", "post-card");
  card.dataset.postId = postId;
  const isOwner = currentUser && post.uid === currentUser.uid;
  card.innerHTML = `
    <div class="post-head">
      <div class="mini-avatar">${post.authorAvatar ? `<img src="${escapeHtml(post.authorAvatar)}">` : avatarFallback(post.authorName)}</div>
      <div class="post-head-text">
        <div class="post-author">${escapeHtml(post.authorName || "مستخدم")}</div>
        <div class="post-time">${timeAgo(post.createdAt)}</div>
      </div>
      ${isOwner ? `<button class="post-delete-btn" title="حذف">🗑</button>` : ""}
    </div>
    <div class="post-content">${escapeHtml(post.content || "")}</div>
    ${post.imageUrl ? `<div class="post-image"><img src="${escapeHtml(post.imageUrl)}" loading="lazy"></div>` : ""}
    <div class="post-actions">
      <button class="post-action like-btn"><span class="like-ic">🤍</span><span class="like-count">0</span></button>
      <button class="post-action comment-btn"><span>💬</span><span class="comment-count">0</span></button>
    </div>
    <div class="comments-section" style="display:none;">
      <div class="comments-list"></div>
      <form class="comment-form">
        <input type="text" placeholder="اكتب تعليقًا..." class="comment-input" maxlength="300">
        <button type="submit">إرسال</button>
      </form>
    </div>
  `;

  if (isOwner) {
    card.querySelector(".post-delete-btn").addEventListener("click", async () => {
      if (!confirm("هل تريد حذف هذا المنشور؟")) return;
      try { await deleteDoc(doc(db, "posts", postId)); showToast("تم حذف المنشور"); }
      catch (e) { showToast("تعذر الحذف — تحقق من الإنترنت."); }
    });
  }

  // likes realtime
  const likesCol = collection(db, "posts", postId, "likes");
  const likeBtn = card.querySelector(".like-btn");
  const likeIc = card.querySelector(".like-ic");
  const likeCountEl = card.querySelector(".like-count");
  onSnapshot(likesCol, (snap) => {
    likeCountEl.textContent = snap.size;
    const likedByMe = currentUser && snap.docs.some(d => d.id === currentUser.uid);
    likeIc.textContent = likedByMe ? "❤️" : "🤍";
    likeBtn.dataset.liked = likedByMe ? "1" : "0";
  });
  likeBtn.addEventListener("click", async () => {
    if (!navigator.onLine) { showToast("محتاج اتصال بالإنترنت للتفاعل مع المنشور 📶"); return; }
    const likeRef = doc(db, "posts", postId, "likes", currentUser.uid);
    try {
      if (likeBtn.dataset.liked === "1") await deleteDoc(likeRef);
      else await setDoc(likeRef, { createdAt: serverTimestamp() });
    } catch (e) { showToast("تعذر تسجيل الإعجاب."); }
  });

  // comments realtime (count always listening; list only rendered when opened)
  const commentsCol = collection(db, "posts", postId, "comments");
  const commentCountEl = card.querySelector(".comment-count");
  const commentsSection = card.querySelector(".comments-section");
  const commentsListEl = card.querySelector(".comments-list");
  const cq = query(commentsCol, orderBy("createdAt", "asc"), limit(200));
  let commentsOpen = false;
  onSnapshot(cq, (snap) => {
    commentCountEl.textContent = snap.size;
    if (commentsOpen) {
      commentsListEl.innerHTML = "";
      snap.forEach(c => {
        const cd = c.data();
        const row = el("div", "comment-row");
        row.innerHTML = `
          <div class="mini-avatar small">${cd.authorAvatar ? `<img src="${escapeHtml(cd.authorAvatar)}">` : avatarFallback(cd.authorName)}</div>
          <div class="comment-bubble">
            <div class="comment-author">${escapeHtml(cd.authorName || "مستخدم")}</div>
            <div class="comment-text">${escapeHtml(cd.content || "")}</div>
          </div>
        `;
        commentsListEl.appendChild(row);
      });
      commentsListEl.scrollTop = commentsListEl.scrollHeight;
    }
  });

  card.querySelector(".comment-btn").addEventListener("click", () => {
    commentsOpen = !commentsOpen;
    commentsSection.style.display = commentsOpen ? "block" : "none";
  });

  card.querySelector(".comment-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!navigator.onLine) { showToast("محتاج اتصال بالإنترنت لإرسال التعليق 📶"); return; }
    const input = card.querySelector(".comment-input");
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    try {
      await addDoc(commentsCol, {
        uid: currentUser.uid,
        authorName: currentProfile.displayName || currentProfile.username,
        authorAvatar: currentProfile.avatarUrl || "",
        content: text,
        createdAt: serverTimestamp()
      });
    } catch (err) { showToast("تعذر إرسال التعليق."); }
  });

  return card;
}

/* ------------------------------------------------------------
   COMPOSER MODAL
   ------------------------------------------------------------ */
function openComposer() {
  composerImagePreview = "";
  $id("composer-content").value = "";
  $id("composer-image-url").value = "";
  $id("composer-preview").style.display = "none";
  openModal("composer-modal");
  setTimeout(() => $id("composer-content").focus(), 200);
}
function wireComposer() {
  $id("composer-image-url").addEventListener("input", (e) => {
    const val = e.target.value.trim();
    const prev = $id("composer-preview");
    if (val) { prev.src = val; prev.style.display = "block"; }
    else prev.style.display = "none";
  });

  $id("composer-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!navigator.onLine) { showToast("محتاج اتصال بالإنترنت لنشر المنشور 📶"); return; }
    const content = $id("composer-content").value.trim();
    const imageUrl = $id("composer-image-url").value.trim();
    if (!content && !imageUrl) { showToast("اكتب شيئًا أولاً ✍️"); return; }
    const btn = $id("composer-submit-btn");
    setLoading(btn, true);
    try {
      await addDoc(collection(db, "posts"), {
        uid: currentUser.uid,
        authorName: currentProfile.displayName || currentProfile.username,
        authorAvatar: currentProfile.avatarUrl || "",
        content, imageUrl: imageUrl || "",
        createdAt: serverTimestamp()
      });
      closeModal("composer-modal");
      showToast("تم النشر بنجاح ✅");
    } catch (err) {
      showToast("تعذر النشر — تحقق من الإنترنت وحاول مجددًا.");
    }
    setLoading(btn, false, "نشر");
  });
}

/* ------------------------------------------------------------
   PROFILE SCREEN
   ------------------------------------------------------------ */
function renderProfileScreen() {
  const wrap = el("div", "profile-screen");
  wrap.innerHTML = `
    <div class="profile-card">
      <div class="profile-avatar-big">${currentProfile.avatarUrl ? `<img src="${escapeHtml(currentProfile.avatarUrl)}">` : avatarFallback(currentProfile.displayName)}</div>
      <div class="profile-username">@${escapeHtml(currentProfile.username || "")}</div>
    </div>
    <form id="profile-form" class="profile-form">
      <div class="form-field">
        <label>الاسم الظاهر</label>
        <input type="text" id="pf-display-name" value="${escapeHtml(currentProfile.displayName || "")}" maxlength="40">
      </div>
      <div class="form-field">
        <label>رابط الصورة الشخصية</label>
        <input type="text" id="pf-avatar" value="${escapeHtml(currentProfile.avatarUrl || "")}" placeholder="https://...">
      </div>
      <div class="form-field">
        <label>نبذة عنك</label>
        <textarea id="pf-bio" maxlength="160">${escapeHtml(currentProfile.bio || "")}</textarea>
      </div>
      <button type="submit" class="primary-btn" id="pf-save-btn">حفظ التعديلات</button>
    </form>
    <div class="section-title">منشوراتي</div>
    <div id="my-posts-list" class="posts-list"></div>
    <button class="logout-btn" id="logout-btn">🚪 تسجيل الخروج</button>
  `;

  wrap.querySelector("#profile-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!navigator.onLine) { showToast("محتاج اتصال بالإنترنت لحفظ التعديلات 📶"); return; }
    const btn = $id("pf-save-btn");
    setLoading(btn, true);
    const displayName = $id("pf-display-name").value.trim() || currentProfile.username;
    const avatarUrl = $id("pf-avatar").value.trim();
    const bio = $id("pf-bio").value.trim();
    try {
      await updateDoc(doc(db, "users", currentUser.uid), { displayName, avatarUrl, bio });
      currentProfile = { ...currentProfile, displayName, avatarUrl, bio };
      showToast("تم حفظ الملف الشخصي ✅");
      paintTab("profile");
    } catch (err) { showToast("تعذر الحفظ — تحقق من الإنترنت."); setLoading(btn, false, "حفظ التعديلات"); }
  });

  wrap.querySelector("#logout-btn").addEventListener("click", async () => {
    if (confirm("هل تريد تسجيل الخروج؟")) await signOut(auth);
  });

  const myListEl = wrap.querySelector("#my-posts-list");
  const mq = query(collection(db, "posts"), where("uid", "==", currentUser.uid), orderBy("createdAt", "desc"), limit(50));
  onSnapshot(mq, (snap) => {
    myListEl.innerHTML = "";
    if (snap.empty) { myListEl.innerHTML = `<div class="empty-state">لم تنشر أي شيء بعد.</div>`; return; }
    snap.forEach(docSnap => myListEl.appendChild(renderPostCard(docSnap.id, docSnap.data())));
  });

  return wrap;
}

/* ------------------------------------------------------------
   MODALS
   ------------------------------------------------------------ */
function openModal(id) { $id(id).classList.add("show"); }
function closeModal(id) { $id(id).classList.remove("show"); }
function wireModals() {
  document.querySelectorAll("[data-close]").forEach(elx => {
    elx.addEventListener("click", () => elx.closest(".modal-overlay").classList.remove("show"));
  });
  document.querySelectorAll(".modal-overlay").forEach(ov => {
    ov.addEventListener("click", e => { if (e.target === ov) ov.classList.remove("show"); });
  });
}

/* ------------------------------------------------------------
   AUTH STATE LISTENER — entry point
   ------------------------------------------------------------ */
onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  if (!user) {
    currentProfile = null;
    authMode = "login";
    renderAuthScreen();
    document.body.classList.remove("app-active");
    return;
  }
  try {
    const snap = await getDoc(doc(db, "users", user.uid));
    if (snap.exists()) currentProfile = snap.data();
    else currentProfile = { username: user.displayName || "user", displayName: user.displayName || "مستخدم", avatarUrl: "", bio: "" };
  } catch (e) {
    currentProfile = { username: user.displayName || "user", displayName: user.displayName || "مستخدم", avatarUrl: "", bio: "" };
  }
  document.body.classList.add("app-active");
  renderShell();
});

/* ------------------------------------------------------------
   INIT
   ------------------------------------------------------------ */
updateOnlineBanner();
wireComposer();
wireModals();

</script>
<script>
  // toggle bottom tab bar visibility with app-active state
  const obs = new MutationObserver(() => {
    document.getElementById("main-tabbar").style.display =
      document.body.classList.contains("app-active") ? "flex" : "none";
  });
  obs.observe(document.body, { attributes: true, attributeFilter: ["class"] });
</script>
