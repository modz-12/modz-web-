<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Modz Web | منصة التواصل والتسوق</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --bg-primary: #0a0e1a;
      --bg-secondary: #111827;
      --bg-card: #1a2234;
      --bg-elevated: #1f2a3f;
      --accent-purple: #8b5cf6;
      --accent-blue: #3b82f6;
      --accent-pink: #ec4899;
      --accent-gold: #f59e0b;
      --accent-green: #10b981;
      --danger: #ef4444;
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      --border-color: rgba(255, 255, 255, 0.1);
      --border-light: rgba(255, 255, 255, 0.05);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
      --gradient-primary: linear-gradient(135deg, #8b5cf6, #3b82f6);
      --gradient-accent: linear-gradient(135deg, #ec4899, #8b5cf6);
      --gradient-gold: linear-gradient(135deg, #f59e0b, #ef4444);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-full: 50px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Tajawal', 'Cairo', sans-serif;
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
      padding-bottom: 80px;
    }
    h1, h2, h3, h4, h5, h6, .brand, .auth-title, .section-title { font-family: 'Cairo', sans-serif; }
    button, input, textarea, select { font-family: inherit; }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--bg-elevated); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-purple); }

    #offline-banner {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      background: var(--gradient-gold);
      color: #fff;
      text-align: center;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 700;
      animation: slideDown 0.5s ease;
      box-shadow: var(--shadow-lg);
    }
    #offline-banner.show { display: block; }
    @keyframes slideDown {
      from { transform: translateY(-100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    #top-header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: rgba(10, 14, 26, 0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-color);
    }
    .brand {
      font-weight: 900;
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      object-fit: cover;
      -webkit-text-fill-color: initial;
      border: 2px solid var(--accent-purple);
    }
    .header-actions { display: flex; gap: 10px; }
    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: var(--transition);
    }
    .icon-btn:hover { background: var(--accent-purple); color: #fff; border-color: var(--accent-purple); }

    #app { max-width: 720px; margin: 0 auto; position: relative; }
    #screen-body { padding: 16px 14px 30px; }

    .auth-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 18px;
      background: linear-gradient(135deg, #0a0e1a 0%, #1a2234 50%, #0a0e1a 100%);
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(165deg, var(--bg-card), var(--bg-secondary));
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 40px 30px;
      box-shadow: var(--shadow-lg);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .auth-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, transparent 70%);
      animation: rotate 20s linear infinite;
    }
    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .auth-logo-img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 24px;
      margin: 0 auto 20px;
      box-shadow: 0 10px 40px rgba(139, 92, 246, 0.5);
      position: relative;
      z-index: 1;
    }
    .auth-title {
      font-weight: 900;
      font-size: 32px;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      position: relative;
      z-index: 1;
    }
    .auth-sub {
      color: var(--text-secondary);
      font-size: 14px;
      margin-top: 6px;
      margin-bottom: 28px;
      position: relative;
      z-index: 1;
    }
    .auth-tabs {
      display: flex;
      background: var(--bg-elevated);
      border-radius: var(--radius-full);
      padding: 4px;
      margin-bottom: 24px;
      position: relative;
      z-index: 1;
    }
    .auth-tab {
      flex: 1;
      padding: 12px;
      border: none;
      background: none;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 14px;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: var(--transition);
    }
    .auth-tab.active {
      background: var(--gradient-primary);
      color: #fff;
    }
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: right;
      position: relative;
      z-index: 1;
    }
    .auth-error {
      color: var(--danger);
      font-size: 13px;
      min-height: 18px;
      text-align: center;
      font-weight: 600;
    }
    .auth-note {
      margin-top: 20px;
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.8;
      position: relative;
      z-index: 1;
    }

    .form-field label {
      display: block;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .form-field input,
    .form-field textarea,
    .form-field select {
      width: 100%;
      background: var(--bg-elevated);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
      transition: var(--transition);
    }
    .form-field textarea { min-height: 90px; resize: vertical; }
    .form-field input:focus,
    .form-field textarea:focus,
    .form-field select:focus {
      border-color: var(--accent-purple);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
    }
    .primary-btn {
      width: 100%;
      padding: 14px;
      border-radius: var(--radius-md);
      border: none;
      background: var(--gradient-primary);
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }
    .primary-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(139, 92, 246, 0.4); }
    .primary-btn:active { transform: translateY(0); }
    .primary-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .composer-teaser {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 20px;
      cursor: pointer;
      transition: var(--transition);
    }
    .composer-teaser:hover {
      border-color: var(--accent-purple);
      box-shadow: 0 4px 20px rgba(139, 92, 246, 0.3);
    }
    .teaser-text { flex: 1; color: var(--text-muted); font-size: 14px; }
    .teaser-icon { font-size: 18px; color: var(--accent-purple); }

    .mini-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--gradient-primary);
      color: #fff;
      font-weight: 800;
      font-size: 18px;
      border: 2px solid var(--accent-purple);
    }
    .mini-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .mini-avatar.small { width: 32px; height: 32px; font-size: 13px; border-width: 1px; }

    .posts-list { display: flex; flex-direction: column; gap: 16px; }
    .post-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 18px;
      transition: var(--transition);
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .post-card:hover { border-color: rgba(139, 92, 246, 0.4); box-shadow: var(--shadow-md); }
    .post-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .post-head-text { flex: 1; }
    .post-author { font-weight: 800; font-size: 15px; color: var(--text-primary); }
    .post-time { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .post-delete-btn { background: none; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; padding: 4px; transition: var(--transition); }
    .post-delete-btn:hover { color: var(--danger); }
    .post-content { font-size: 15px; line-height: 1.9; color: var(--text-primary); white-space: pre-wrap; word-break: break-word; }
    .post-image { margin-top: 14px; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-color); max-height: 450px; }
    .post-image img { width: 100%; height: 100%; object-fit: cover; }
    .post-actions { display: flex; gap: 10px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border-light); }
    .post-action {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: var(--radius-full);
      border: none;
      background: var(--bg-elevated);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
    }
    .post-action:hover { background: rgba(139, 92, 246, 0.2); color: var(--accent-purple); }
    .like-btn[data-liked="1"] { color: var(--accent-pink); background: rgba(236, 72, 153, 0.15); }
    .comments-section { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border-color); }
    .comments-list { display: flex; flex-direction: column; gap: 10px; max-height: 280px; overflow-y: auto; margin-bottom: 12px; }
    .comment-row { display: flex; gap: 8px; align-items: flex-start; }
    .comment-bubble { background: var(--bg-elevated); border-radius: var(--radius-md); padding: 10px 14px; flex: 1; }
    .comment-author { font-size: 12px; font-weight: 700; color: var(--accent-purple); }
    .comment-text { font-size: 13px; color: var(--text-secondary); margin-top: 2px; line-height: 1.7; }
    .comment-form { display: flex; gap: 8px; }
    .comment-form input {
      flex: 1;
      background: var(--bg-elevated);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-full);
      padding: 10px 16px;
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
    }
    .comment-form input:focus { border-color: var(--accent-purple); }
    .comment-form button {
      padding: 10px 20px;
      border-radius: var(--radius-full);
      border: none;
      background: var(--gradient-primary);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
    }
    .comment-form button:hover { transform: translateY(-2px); }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      padding: 60px 20px;
      border: 2px dashed var(--border-color);
      border-radius: var(--radius-lg);
    }

    .messages-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .new-chat-btn {
      padding: 10px 18px;
      border-radius: var(--radius-full);
      border: 1px solid var(--accent-purple);
      background: rgba(139, 92, 246, 0.15);
      color: var(--accent-purple);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
    }
    .new-chat-btn:hover { background: var(--accent-purple); color: #fff; }
    .convos-list { display: flex; flex-direction: column; gap: 10px; }
    .convo-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      cursor: pointer;
      transition: var(--transition);
    }
    .convo-row:hover { border-color: var(--accent-purple); background: var(--bg-elevated); }
    .convo-mid { flex: 1; min-width: 0; }
    .convo-name { font-weight: 700; font-size: 14px; color: var(--text-primary); }
    .convo-preview { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .convo-time { font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
    .search-results { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; max-height: 360px; overflow-y: auto; }



    .notice-btn{position:relative}.notification-badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:20px;background:var(--danger);color:#fff;font-size:9px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg-primary)}
    .notice-panel{position:fixed;top:68px;right:12px;left:12px;max-width:420px;margin-left:auto;z-index:250;background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:18px;box-shadow:var(--shadow-lg);overflow:hidden;display:none}.notice-panel.show{display:block;animation:fadeIn .2s ease}.notice-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border-color)}.notice-list{max-height:55vh;overflow:auto}.notice-item{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border-light);cursor:pointer}.notice-item.unread{background:rgba(139,92,246,.08)}.notice-dot{width:8px;height:8px;border-radius:50%;background:var(--accent-purple);margin-top:7px;flex:none}.notice-text{flex:1;font-size:13px;line-height:1.6}.notice-time{font-size:10px;color:var(--text-muted)}
    .attach-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--border-color);background:var(--bg-card);color:var(--text-secondary);cursor:pointer}.attach-btn:hover{color:#fff;background:var(--accent-purple)}.chat-file-name{font-size:11px;color:var(--text-muted);padding:0 8px}.chat-file-card{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.07);margin-bottom:5px}.chat-file-card a{color:#fff;text-decoration:underline;overflow-wrap:anywhere}.message-tools{display:flex;gap:5px;margin-top:3px;opacity:.75}.message-tool{border:0;background:transparent;color:inherit;cursor:pointer;font-size:10px;padding:2px 5px}.message-tool:hover{color:#fff}.editing-banner{display:none;padding:7px 12px;background:rgba(139,92,246,.12);color:var(--accent-purple);font-size:11px;border-top:1px solid var(--border-color)}.editing-banner.show{display:flex;justify-content:space-between}.presence-online{color:var(--accent-green)!important}.presence-offline{color:var(--text-muted)!important}.request-actions{display:flex;gap:6px}.request-actions button{border:0;border-radius:20px;padding:7px 10px;font-weight:800;cursor:pointer}.accept-request{background:var(--accent-green);color:#fff}.reject-request{background:rgba(239,68,68,.15);color:var(--danger)}

    /* ===== Modz Web Pro Chat ===== */
    .chat-screen {
      display:flex;
      flex-direction:column;
      height:calc(100dvh - 140px);
      min-height:420px;
      margin:-16px -14px 0;
      background:
        radial-gradient(circle at 15% 10%, rgba(139,92,246,.10), transparent 30%),
        radial-gradient(circle at 90% 90%, rgba(59,130,246,.08), transparent 28%),
        var(--bg-primary);
    }
    .chat-header {
      position:sticky;
      top:0;
      z-index:5;
      display:flex;
      align-items:center;
      gap:12px;
      padding:12px 14px;
      background:rgba(17,24,39,.92);
      backdrop-filter:blur(18px);
      border-bottom:1px solid var(--border-color);
    }
    .chat-header-info{flex:1;min-width:0}
    .chat-header-name{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .chat-header-status{font-size:11px;color:var(--accent-green);margin-top:1px}
    .chat-header-actions{display:flex;gap:6px}
    .chat-head-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--border-color);background:var(--bg-card);color:var(--text-secondary);cursor:pointer}
    .chat-head-btn:hover{background:var(--accent-purple);color:#fff}
    .chat-messages{
      flex:1;overflow-y:auto;padding:18px 14px 24px;
      display:flex;flex-direction:column;gap:8px;
      overscroll-behavior:contain;
      scroll-behavior:smooth;
    }
    .chat-day{
      align-self:center;padding:5px 12px;border-radius:var(--radius-full);
      background:rgba(255,255,255,.06);border:1px solid var(--border-light);
      color:var(--text-muted);font-size:10px;margin:8px 0;
    }
    .chat-bubble-row{display:flex;align-items:flex-end;gap:6px}
    .chat-bubble-row.mine{justify-content:flex-end}
    .chat-bubble-row.theirs{justify-content:flex-start}
    .chat-bubble-wrap{max-width:min(82%,520px)}
    .chat-bubble{
      padding:9px 12px 7px;border-radius:17px;
      font-size:14px;line-height:1.65;word-break:break-word;
      box-shadow:0 3px 12px rgba(0,0,0,.12);
    }
    .chat-bubble-row.mine .chat-bubble{background:var(--gradient-primary);color:#fff;border-bottom-right-radius:5px}
    .chat-bubble-row.theirs .chat-bubble{background:var(--bg-card);border:1px solid var(--border-color);border-bottom-left-radius:5px}
    .chat-meta{display:flex;align-items:center;justify-content:flex-end;gap:5px;font-size:9px;margin-top:3px;opacity:.72}
    .chat-bubble-row.mine .chat-meta{color:#fff}
    .chat-bubble-row.theirs .chat-meta{color:var(--text-muted)}
    .chat-status{font-weight:900}
    .chat-status.read{color:#67e8f9}
    .chat-image{display:block;max-width:100%;max-height:300px;border-radius:13px;margin-bottom:5px}
    .chat-link{color:#bfdbfe;text-decoration:underline;overflow-wrap:anywhere}
    .chat-empty{margin:auto;text-align:center;color:var(--text-muted);padding:30px}
    .chat-typing{min-height:18px;padding:0 18px;color:var(--text-muted);font-size:11px}
    .chat-input-form{
      display:flex;align-items:flex-end;gap:8px;padding:9px;
      background:rgba(17,24,39,.96);border-top:1px solid var(--border-color);
      padding-bottom:calc(9px + env(safe-area-inset-bottom));
    }
    .chat-input-wrap{flex:1;position:relative}
    .chat-input-form textarea{
      width:100%;min-height:44px;max-height:130px;resize:none;
      background:var(--bg-elevated);border:1px solid var(--border-color);
      border-radius:18px;padding:11px 14px;color:var(--text-primary);
      font-size:14px;outline:none;line-height:1.5;
    }
    .chat-input-form textarea:focus{border-color:var(--accent-purple);box-shadow:0 0 0 3px rgba(139,92,246,.13)}
    .chat-send-btn{
      width:44px;height:44px;flex-shrink:0;border-radius:50%;border:none;
      background:var(--gradient-primary);color:#fff;cursor:pointer;
      box-shadow:0 5px 18px rgba(139,92,246,.35);transition:var(--transition)
    }
    .chat-send-btn:hover{transform:translateY(-2px)}
    .chat-send-btn:disabled{opacity:.55;transform:none}
    .convo-row{position:relative}
    .convo-unread{
      min-width:20px;height:20px;padding:0 6px;border-radius:20px;
      background:var(--accent-purple);color:#fff;display:flex;align-items:center;justify-content:center;
      font-size:10px;font-weight:900
    }
    .convo-row.unread .convo-name{color:#fff}
    .convo-row.unread .convo-preview{color:var(--text-secondary)}

          await updateProfile(cred.user, { displayName: username });
          await setDoc(doc(db, "users", cred.user.uid), { username, displayName: username, avatarUrl: "", bio: "", friends: [], createdAt: serverTimestamp(), online:false, lastSeen:serverTimestamp() });
          showToast("تم إنشاء الحساب بنجاح 🎉");
        } else {
          await signInWithEmailAndPassword(auth, email, password);
          showToast("أهلاً بعودتك 👋");
        }
      } catch (err) {
        errBox.textContent = translateAuthError(err);
        setLoading(btn, false, authMode === "login" ? "دخول" : "إنشاء الحساب");
      }
    });

  function translateAuthError(err) {
    const msg = (err && err.message) || "";

    const map = {

      "auth/invalid-email": "صيغة البريد الإلكتروني غير صحيحة.",

      "auth/user-not-found": "لا يوجد حساب بهذا البريد الإلكتروني.",
      "auth/wrong-password": "كلمة المرور غير صحيحة.",
      "auth/invalid-credential": "بيانات الدخول غير صحيحة.",
      "auth/network-request-failed": "تعذر الاتصال — تأكد أن الإنترنت مفعّل لديك."

  function formatChatTime(ts) {
    if (!ts) return "الآن";
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit" });
  }

  function sameDay(a, b) {
    if (!a || !b) return false;
    const da = a.toDate ? a.toDate() : new Date(a);
    const dbb = b.toDate ? b.toDate() : new Date(b);
    return da.toDateString() === dbb.toDateString();
  }

  function safeMessageHtml(text) {
    const escaped = escapeHtml(text || "");
    const urlPattern = /(https?:\/\/[^\s<]+)/g;
    return escaped.replace(urlPattern, (url) => {
      const clean = url.replace(/[),.!؟،]+$/g, "");
      return `<a class="chat-link" href="${clean}" target="_blank" rel="noopener noreferrer">${clean}</a>`;
    });
  }

  function chatDateLabel(ts) {
    if (!ts) return "اليوم";
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    const now = new Date();
    if (d.toDateString() === now.toDateString()) return "اليوم";
    const y = new Date(now); y.setDate(now.getDate() - 1);
    if (d.toDateString() === y.toDateString()) return "أمس";
    return d.toLocaleDateString("ar-EG", { day: "numeric", month: "long", year: "numeric" });
  }

    let selectedImage = null;
    let replyTo = null;
    let messageDocs = [];
    let typingTimer = null;
    let stopConversationListener = null;

    wrap.querySelector("#chat-attach-btn").onclick = () => fileInput.click();
    fileInput.onchange = () => {
      selectedImage = fileInput.files[0] || null;
      if (!selectedImage) {
        fileNameEl.textContent = "";
        return;
      }
      if (!selectedImage.type.startsWith("image/")) {
        selectedImage = null;
        fileInput.value = "";
        showToast("المرفق المحلي المسموح به هنا هو صورة صغيرة فقط.");
        return;
      }
      if (selectedImage.size > 650 * 1024) {
        selectedImage = null;
        fileInput.value = "";
        showToast("الصورة كبيرة. اختر صورة أقل من 650KB أو استخدم رابطاً مباشراً.");
        return;
      }
      fileNameEl.textContent = `🖼️ ${selectedImage.name}`;
    };

    wrap.querySelector("#cancel-edit").onclick = () => {
      editingMessageId = null;
      editBanner.classList.remove("show");
      input.value = "";
      mediaUrlInput.value = "";
    };

    wrap.querySelector("#cancel-reply").onclick = () => {
      replyTo = null;
      replyBanner.classList.remove("show");
    };

    wrap.querySelector("#chat-search-btn").onclick = () => {
      searchBox.hidden = !searchBox.hidden;
      if (!searchBox.hidden) searchInput.focus();
    };
    wrap.querySelector("#chat-search-close").onclick = () => {
      searchBox.hidden = true;
      searchInput.value = "";
      filterRenderedMessages("");
    };
    searchInput.addEventListener("input", () => filterRenderedMessages(searchInput.value.trim().toLowerCase()));

    wrap.querySelector("#chat-pin-btn").onclick = async () => {
      try {
        const ref = doc(db, "conversations", conversationId);
        const snap = await getDoc(ref);
        const data = snap.exists() ? snap.data() : {};
        const pinned = Array.isArray(data.pinnedFor) ? data.pinnedFor : [];
        const mine = pinned.includes(currentUser.uid);
        await updateDoc(ref, { pinnedFor: mine ? arrayRemove(currentUser.uid) : arrayUnion(currentUser.uid) });
        showToast(mine ? "تم إلغاء تثبيت المحادثة" : "تم تثبيت المحادثة 📌");
      } catch (e) {
        showToast("تعذر تثبيت المحادثة");
      }
    };

    function filterRenderedMessages(term) {
      wrap.querySelectorAll(".chat-bubble-row").forEach(row => {
        if (!term) {
          row.style.display = "";
          return;
        }
        row.style.display = row.textContent.toLowerCase().includes(term) ? "" : "none";
      });
    }

    function readTimestamp(ts) {
      if (!ts) return new Date();
      return ts.toDate ? ts.toDate() : new Date(ts);
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function messagePreview(m) {
      const text = (m.text || "").trim();
      if (text) return text.slice(0, 120);
      if ((m.fileType || "").startsWith("image/")) return "🖼️ صورة";
      if (m.fileUrl) return "📎 مرفق";
      return "رسالة";
    }

    function reactionCount(reactions) {
      return Object.keys(reactions || {}).length;
    }

    function reactionHtml(id, m) {
      const reactions = m.reactions || {};
      const mine = reactions[currentUser.uid] || "";
      const emojis = ["❤️", "👍", "😂", "😮", "😢", "🔥"];
      return `<div class="reaction-row">${emojis.map(emoji => {
        const count = Object.values(reactions).filter(v => v === emoji).length;
        return `<button type="button" class="reaction-btn ${mine === emoji ? "active" : ""}" data-message-id="${id}" data-reaction="${emoji}">${emoji}${count ? `<small>${count}</small>` : ""}</button>`;
      }).join("")}</div>`;
    }

    function buildMessageRow(d) {
      const m = d.data();
      const mine = m.senderId === currentUser.uid;
      const ts = m.createdAt;
      const row = el("div", `chat-bubble-row ${mine ? "mine" : "theirs"}`);
      row.dataset.messageId = d.id;
      row.dataset.searchText = `${m.text || ""} ${m.fileName || ""}`.toLowerCase();
      const bw = el("div", "chat-bubble-wrap");
      let body = "";

      if (m.replyTo && m.replyTo.preview) {
        body += `<div class="quoted-message"><span>↩</span>${escapeHtml(m.replyTo.preview)}</div>`;
      }

      if (m.fileUrl && (m.fileType || "").startsWith("image/")) {
        body += `<a class="chat-image-link" href="${escapeHtml(m.fileUrl)}" target="_blank" rel="noopener"><img class="chat-image" src="${escapeHtml(m.fileUrl)}" loading="lazy" alt="صورة"></a>`;
      } else if (m.fileUrl && (m.fileType || "").startsWith("video/")) {
        body += `<video class="chat-video" src="${escapeHtml(m.fileUrl)}" controls preload="metadata"></video>`;
      } else if (m.fileUrl) {
        body += `<div class="chat-file-card"><i class="fas fa-file-arrow-down"></i><a href="${escapeHtml(m.fileUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(m.fileName || "فتح الملف")}</a></div>`;
      }

      if (m.text) body += `<div class="message-text">${safeMessageHtml(m.text)}</div>`;

      const read = mine && m.readAt;
      const status = mine ? `<span class="chat-status ${read ? "read" : ""}">${read ? "✓✓" : "✓"}</span>` : "";
      const edited = m.editedAt ? " · تم التعديل" : "";
      const deleted = m.deleted === true;
      if (deleted) body = `<div class="deleted-message">تم حذف هذه الرسالة</div>`;

      bw.innerHTML = `
        <div class="chat-bubble ${deleted ? "is-deleted" : ""}">${body || "رسالة"}</div>
        <div class="chat-meta"><span>${formatChatTime(ts)}${edited}</span>${status}</div>
        ${deleted ? "" : reactionHtml(d.id, m)}
        <div class="message-tools advanced-message-tools">
          <button type="button" class="message-tool reply-message">↩ رد</button>
          <button type="button" class="message-tool copy-message">نسخ</button>
          ${mine && !deleted ? `<button type="button" class="message-tool edit-message">تعديل</button><button type="button" class="message-tool delete-message">حذف</button>` : ""}
        </div>`;

      row.appendChild(bw);

      const replyBtn = row.querySelector(".reply-message");
      if (replyBtn) {
        replyBtn.onclick = () => {
          replyTo = { id: d.id, preview: messagePreview(m), senderId: m.senderId };
          replyPreview.textContent = ` — ${messagePreview(m)}`;
          replyBanner.classList.add("show");
          input.focus();
        };
      }

      const copyBtn = row.querySelector(".copy-message");
      if (copyBtn) {
        copyBtn.onclick = async () => {
          const value = m.text || m.fileUrl || "";
          if (!value) {
            showToast("لا يوجد نص لنسخه");
            return;
          }
          try {
            await navigator.clipboard.writeText(value);
            showToast("تم النسخ 📋");
          } catch (_) {
            showToast("تعذر النسخ من الجهاز");
          }
        };
      }

      const editBtn = row.querySelector(".edit-message");
      if (editBtn) {
        editBtn.onclick = () => {
          editingMessageId = d.id;
          input.value = m.text || "";
          mediaUrlInput.value = m.fileUrl || "";
          editBanner.classList.add("show");
          replyTo = null;
          replyBanner.classList.remove("show");
          input.focus();
        };
      }

      const deleteBtn = row.querySelector(".delete-message");
      if (deleteBtn) {
        deleteBtn.onclick = async () => {
          const hard = confirm("حذف الرسالة نهائياً؟\nاضغط إلغاء لإخفائها فقط.");
          try {
            const ref = doc(db, "conversations", conversationId, "messages", d.id);
            if (hard) {
              await deleteDoc(ref);
            } else {
              await updateDoc(ref, { deleted: true, text: "", fileUrl: "", fileName: "", fileType: "", deletedAt: serverTimestamp() });
            }
            showToast("تم حذف الرسالة 🗑️");
          } catch (e) {
            showToast("تعذر حذف الرسالة");
          }
        };
      }

      row.querySelectorAll(".reaction-btn").forEach(btn => {
        btn.onclick = async () => {
          const messageId = btn.dataset.messageId;
          const emoji = btn.dataset.reaction;
          const ref = doc(db, "conversations", conversationId, "messages", messageId);
          try {
            const snap = await getDoc(ref);
            if (!snap.exists()) return;
            const data = snap.data();
            const reactions = { ...(data.reactions || {}) };
            if (reactions[currentUser.uid] === emoji) delete reactions[currentUser.uid];
            else reactions[currentUser.uid] = emoji;
            await updateDoc(ref, { reactions });
          } catch (e) {
            showToast("تعذر إضافة التفاعل");
          }
        };
      });

      return row;
    }

    const mq = query(
      collection(db, "conversations", conversationId, "messages"),
      orderBy("createdAt", "desc"),
      limit(200)
    );

    messagesUnsub = onSnapshot(mq, snap => {
      messageDocs = [...snap.docs].reverse();
      msgsEl.innerHTML = "";
      let prevDate = null;

      if (!messageDocs.length) {
        msgsEl.innerHTML = '<div class="chat-empty"><div style="font-size:42px">💬</div><b>ابدأ المحادثة</b><br>أرسل أول رسالة الآن</div>';
        return;
      }

      messageDocs.forEach(d => {
        const m = d.data();
        const date = readTimestamp(m.createdAt);
        if (!prevDate || prevDate.toDateString() !== date.toDateString()) {
          const day = el("div", "chat-day", chatDateLabel(m.createdAt));
          msgsEl.appendChild(day);
        }
        prevDate = date;
        msgsEl.appendChild(buildMessageRow(d));
      });

      filterRenderedMessages(searchInput.value.trim().toLowerCase());
      requestAnimationFrame(() => {
        msgsEl.scrollTop = msgsEl.scrollHeight;
      });

      messageDocs
        .filter(d => {
          const m = d.data();
          return m.senderId !== currentUser.uid && !m.readAt;
        })
        .slice(-50)
        .forEach(d => {
          updateDoc(doc(db, "conversations", conversationId, "messages", d.id), {
            readAt: serverTimestamp()
          }).catch(() => {});
        });
    }, err => {
      console.error(err);
      msgsEl.innerHTML = '<div class="chat-empty">تعذر تحميل الرسائل. تحقق من قواعد Firestore.</div>';
    });

    stopConversationListener = onSnapshot(doc(db, "conversations", conversationId), snap => {
      if (!snap.exists()) return;
      const c = snap.data();
      const otherTyping = c.typing && c.typing[otherUser.uid];
      if (otherTyping) {
        const t = otherTyping.toDate ? otherTyping.toDate() : new Date(otherTyping);
        if (Date.now() - t.getTime() < 5000) {
          typingLine.textContent = `${otherUser.displayName || "مستخدم"} يكتب الآن...`;
          return;
        }
      }
      typingLine.textContent = "";
    });

    onSnapshot(doc(db, "users", otherUser.uid), snap => {
      const u = snap.exists() ? snap.data() : otherUser;
      const online = isOnlineUser(u);
      const pe = wrap.querySelector("#chat-presence");
      if (pe) {
        pe.textContent = online ? "● متصل الآن" : presenceLabel(u);
        pe.className = "chat-header-status " + (online ? "presence-online" : "presence-offline");
      }
    });

    input.oninput = () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 130) + "px";
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => {
        updateDoc(doc(db, "conversations", conversationId), {
          [`typing.${currentUser.uid}`]: serverTimestamp()
        }).catch(() => {});
      }, 250);
    };

    input.onkeydown = e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        wrap.querySelector("#chat-input-form").requestSubmit();
      }
    };

    wrap.querySelector("#chat-input-form").onsubmit = async e => {
      e.preventDefault();
      if (!currentUser) return;

      const text = input.value.trim();
      const remoteUrl = mediaUrlInput.value.trim();
      if (!text && !selectedImage && !remoteUrl && !editingMessageId) return;

      sendBtn.disabled = true;
      input.disabled = true;

      try {
        if (editingMessageId) {
          await updateDoc(doc(db, "conversations", conversationId, "messages", editingMessageId), {
            text,
            fileUrl: remoteUrl || "",
            fileName: remoteUrl ? "مرفق" : "",
            fileType: remoteUrl ? detectMediaType(remoteUrl) : "",
            editedAt: serverTimestamp()
          });
          editingMessageId = null;
          editBanner.classList.remove("show");
          input.value = "";
          mediaUrlInput.value = "";
          showToast("تم تعديل الرسالة ✅");
        } else {
          let fileUrl = remoteUrl;
          let fileName = remoteUrl ? "مرفق" : "";
          let fileType = remoteUrl ? detectMediaType(remoteUrl) : "";

          if (selectedImage) {
            fileUrl = await fileToDataUrl(selectedImage);
            fileName = selectedImage.name;
            fileType = selectedImage.type || "image/jpeg";
          }

          const convRef = doc(db, "conversations", conversationId);
          const msgRef = doc(collection(db, "conversations", conversationId, "messages"));
          const batch = writeBatch(db);
          const preview = fileName ? (text ? `${text} 📎` : `📎 ${fileName}`) : (text.length > 120 ? text.slice(0, 120) + "…" : text);

          batch.set(msgRef, {
            senderId: currentUser.uid,
            text,
            fileUrl,
            fileName,
            fileType,
            createdAt: serverTimestamp(),
            readAt: null,
            editedAt: null,
            deleted: false,
            reactions: {},
            replyTo: replyTo || null
          });

          batch.update(convRef, {
            lastMessage: preview,
            lastMessageAt: serverTimestamp(),
            lastSenderId: currentUser.uid,
            [`unread.${otherUser.uid}`]: increment(1),
            [`typing.${currentUser.uid}`]: null
          });

          await batch.commit();

          input.value = "";
          mediaUrlInput.value = "";
          selectedImage = null;
          fileInput.value = "";
          fileNameEl.textContent = "";
          replyTo = null;
          replyBanner.classList.remove("show");
        }

        input.style.height = "auto";
        requestAnimationFrame(() => {
          msgsEl.scrollTop = msgsEl.scrollHeight;
        });
      } catch (err) {
        console.error(err);
        showToast(err.message || "تعذر إرسال الرسالة");
      } finally {
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
      }
    };

    return wrap;
  }

  function detectMediaType(url) {
    const clean = (url || "").split("?")[0].toLowerCase();
    if (/\.(jpg|jpeg|png|gif|webp|bmp|svg)$/.test(clean)) return "image/*";
    if (/\.(mp4|webm|ogg|mov|m4v)$/.test(clean)) return "video/*";
    if (/\.(mp3|wav|m4a|aac|ogg)$/.test(clean)) return "audio/*";
    return "application/octet-stream";
  }

    wrap.innerHTML=`<div class="section-title"><i class="fas fa-user-plus"></i> طلبات الصداقة</div><div id="requests-list"></div><div class="section-title" style="margin-top:24px"><i class="fas fa-users"></i> المستخدمون</div><div id="friends-list" class="friends-list"></div>`;
    const reqEl=wrap.querySelector("#requests-list"),listEl=wrap.querySelector("#friends-list");

    friendsUnsub=()=>{reqUnsub();userUnsub()}; return wrap;
  }

  function wireModals() {
    document.querySelectorAll("[data-close]").forEach(elx => {
      elx.addEventListener("click", () => elx.closest(".modal-overlay").classList.remove("show"));
    });
    document.querySelectorAll(".modal-overlay").forEach(ov => {

  }
  function startPresence(){clearInterval(presenceTimer);updatePresence(true);presenceTimer=setInterval(()=>updatePresence(true),30000);window.addEventListener("beforeunload",()=>updatePresence(false))}
  function isOnlineUser(u){if(u.online)return true;if(!u.lastSeen)return false;const d=u.lastSeen.toDate?u.lastSeen.toDate():new Date(u.lastSeen);return Date.now()-d.getTime()<90000}

  function loadProSettings() {
    const defaults = {
      theme: "dark",
      compact: false,
      reduceMotion: false,
      browserNotifications: false,
      sound: true,
      saveDrafts: true,
      autoRead: true,
      enterToSend: true,
      showOnlineStrip: true
    };
    try {
      const raw = localStorage.getItem(PRO_SETTINGS_KEY);
      return { ...defaults, ...(raw ? JSON.parse(raw) : {}) };
    } catch (_) {
      return defaults;
    }
  }

  function saveProSettings() {
    try {
      localStorage.setItem(PRO_SETTINGS_KEY, JSON.stringify(proSettings));
    } catch (_) {}
    applyProSettings();
  }

  function applyProSettings() {
    document.body.classList.toggle("pro-light", proSettings.theme === "light");
    document.body.classList.toggle("pro-compact", !!proSettings.compact);
    document.body.classList.toggle("reduce-motion", !!proSettings.reduceMotion);

  function proEscape(value) {
    return escapeHtml(String(value ?? ""));
  }

  function proNow() {
    return new Date();
  }

  function proSafeUrl(value) {
    try {
      const url = new URL(value);
      if (!["http:", "https:"].includes(url.protocol)) return "";
      return url.href;
    } catch (_) {
      return "";
    }
  }

  function proDebounce(fn, wait = 350) {
    let timer = null;
    return (...args) => {
      clearTimeout(timer);
      timer = setTimeout(() => fn(...args), wait);
    };
  }

  function proDownload(filename, text, type = "application/json") {
    const blob = new Blob([text], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1200);
  }

  function proPlaySound() {
    if (!proSettings.sound) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = 740;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.035, ctx.currentTime + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.13);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.14);
    } catch (_) {}
  }

      if (!term) {

          getDocs(query(collection(db, "users"), orderBy("username"), startAt(term), endAt(term + "\uf8ff"), limit(20))),
          getDocs(query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(100)))

        const users = usersSnap.docs.filter(d => d.id !== currentUser?.uid);
        const posts = postsSnap.docs.filter(d => {
          const p = d.data();
          return `${p.content || ""} ${p.authorName || ""}`.toLowerCase().includes(term);
        }).slice(0, 20);
        results.innerHTML = "";
        if (!users.length && !posts.length) {
          results.innerHTML = '<div class="pro-empty">لا توجد نتائج.</div>';

                await startOrOpenChat({ uid: d.id, displayName: u.displayName || u.username, avatarUrl: u.avatarUrl || "", username: u.username });

            };
            results.appendChild(item);
          });

        if (posts.length) {
          const title = el("div", "pro-section-title");
          title.style.marginTop = "16px";
          title.textContent = "المنشورات";
          results.appendChild(title);
          posts.forEach(d => {

            const item = el("div", "pro-search-item");
            item.innerHTML = `<div class="mini-avatar">${p.authorAvatar ? `<img src="${proEscape(p.authorAvatar)}">` : avatarFallback(p.authorName)}</div><div class="pro-search-meta"><div class="pro-search-name">${proEscape(p.authorName || "مستخدم")}</div><div class="pro-search-sub">${proEscape((p.content || "").slice(0, 150))}</div></div><i class="fas fa-arrow-left"></i>`;
            item.onclick = () => {
              document.querySelector(".pro-panel:last-of-type")?.remove();
              paintTab("feed");
              setTimeout(() => {
                const card = document.querySelector(`[data-post-id="${CSS.escape(d.id)}"]`);

                  card.classList.add("pro-highlight");

            };

          });
        }
      } catch (e) {
        console.error(e);
        results.innerHTML = '<div class="pro-empty">تعذر البحث. تأكد من قواعد Firestore والفهارس.</div>';
      }
    };
    input.addEventListener("input", proDebounce(run, 400));
  }

        showToast("تعذر حفظ المنشور");

    };

    tools.querySelector(".pro-share-btn").onclick = async () => {
      const url = `${location.href.split("#")[0]}#post=${encodeURIComponent(postId)}`;
      try {
        if (navigator.share) {
          await navigator.share({ title: "Modz Web", text: post.content || "منشور على Modz Web", url });
        } else {
          await navigator.clipboard.writeText(url);
          showToast("تم نسخ رابط المنشور 📋");
        }
      } catch (_) {}
    };

    tools.querySelector(".pro-copy-btn").onclick = async () => {
      const url = `${location.href.split("#")[0]}#post=${encodeURIComponent(postId)}`;
      try {
        await navigator.clipboard.writeText(url);
        showToast("تم نسخ رابط المنشور 📋");
      } catch (_) {
        showToast("تعذر نسخ الرابط");
      }
    };

    const edit = tools.querySelector(".pro-edit-post");
    if (edit) {
      edit.onclick = async () => {
        const next = prompt("تعديل نص المنشور:", post.content || "");

        try {
          await updateDoc(doc(db, "posts", postId), { content: next.trim(), editedAt: serverTimestamp() });
          showToast("تم تعديل المنشور ✏️");
        } catch (_) {
          showToast("تعذر تعديل المنشور");
        }
      };

    const commentsList = card.querySelector(".comments-list");
    if (commentsList) {
      const observer = new MutationObserver(() => {
        commentsList.querySelectorAll(".comment-row").forEach(row => {
          if (row.dataset.proComment === "1") return;
          row.dataset.proComment = "1";

    if (list) {

        list.querySelectorAll(".post-card").forEach(card => {

      observer.observe(list, { childList: true });

  function proInstallFeedTools(wrap) {
    if (!wrap || wrap.querySelector(".pro-feed-tools")) return;
    const search = wrap.querySelector("#feed-search-input");
    if (!search) return;
    const tools = el("div", "pro-feed-tools");
    tools.innerHTML = `
      <button class="pro-feed-tool active" data-filter="all">الكل</button>
      <button class="pro-feed-tool" data-filter="mine">منشوراتي</button>
      <button class="pro-feed-tool" data-filter="images">صور</button>

    tools.querySelectorAll(".pro-feed-tool").forEach(btn => {
      btn.onclick = async () => {
        tools.querySelectorAll(".pro-feed-tool").forEach(x => x.classList.remove("active"));
        btn.classList.add("active");
        await proApplyFeedFilter(wrap, btn.dataset.filter);
      };
    });

  async function proApplyFeedFilter(wrap, filter) {
    const cards = [...wrap.querySelectorAll(".post-card")];
    for (const card of cards) {
      const id = card.dataset.postId;
      const item = proFeedCache.find(x => x.id === id);
      const p = item ? item.data : null;
      let visible = true;
      if (filter === "mine") visible = p?.uid === currentUser.uid;
      if (filter === "images") visible = !!p?.imageUrl;
      if (filter === "text") visible = !!p?.content && !p?.imageUrl;
      if (filter === "saved") visible = await proIsBookmarked(id);
      card.style.display = visible ? "" : "none";
    }
  }

  function proStartBrowserNotifications() {
    if (proNotificationsUnsub) proNotificationsUnsub();
    const q = query(collection(db, "notifications"), where("uid", "==", currentUser.uid), orderBy("createdAt", "desc"), limit(30));
    let firstSnapshot = true;
    proNotificationsUnsub = onSnapshot(q, snap => {
      snap.docChanges().forEach(change => {
        if (change.type !== "added") return;
        const data = change.doc.data();
        if (firstSnapshot) return;
        if (proLastNotificationIds.has(change.doc.id)) return;
        proLastNotificationIds.add(change.doc.id);
        if (data.read) return;
        proPlaySound();
        proLiveToast("إشعار جديد", data.text || "لديك نشاط جديد", "🔔");
        proNotifyBrowser("Modz Web", data.text || "لديك إشعار جديد", WEB_ICON);
      });
      snap.docs.forEach(d => proLastNotificationIds.add(d.id));
      firstSnapshot = false;
    }, err => console.warn("Pro notification listener", err));
  }

  function proStartOnlineUsers() {
    if (proUsersUnsub) proUsersUnsub();
    const q = query(collection(db, "users"), where("online", "==", true), limit(30));

      proRenderOnlineStrip(snap.docs.map(d => ({ uid: d.id, ...d.data() })));

  function proInstallDraftTools() {
    if (!currentUser) return;
    const composer = $id("composer-content");
    if (!composer || composer.dataset.proDraft === "1") return;
    composer.dataset.proDraft = "1";
    if (proSettings.saveDrafts) {
      try {
        const draft = JSON.parse(localStorage.getItem(`${PRO_DRAFT_KEY}_${currentUser.uid}`) || "null");
        if (draft?.content) composer.value = draft.content;
      } catch (_) {}
    }
    composer.addEventListener("input", proDebounce(() => {
      if (!proSettings.saveDrafts) return;
      try {
        localStorage.setItem(`${PRO_DRAFT_KEY}_${currentUser.uid}`, JSON.stringify({ content: composer.value, savedAt: Date.now() }));
      } catch (_) {}
    }, 300));

    const match = location.hash.match(/^#post=(.+)$/);

    const id = decodeURIComponent(match[1]);
    paintTab("feed");

      const card = document.querySelector(`[data-post-id="${CSS.escape(id)}"]`);
      if (!card) return;
      card.scrollIntoView({ behavior: "smooth", block: "center" });
      card.classList.add("pro-highlight");
      setTimeout(() => card.classList.remove("pro-highlight"), 1800);
    }, 500);

    const body = $id("screen-body");

    const observer = new MutationObserver(() => {
      const input = body.querySelector("#chat-input");
      if (!input || input.dataset.proDraft === "1") return;
      input.dataset.proDraft = "1";

  function proValidateText(value, min, max) {
    const text = String(value || "").trim();
    if (text.length < min) return { ok: false, reason: `الحد الأدنى ${min}` };
    if (text.length > max) return { ok: false, reason: `الحد الأقصى ${max}` };
    return { ok: true, value: text };
  }

  function proValidateUsername(value) {
    const result = proValidateText(value, MODZ_FIELD_LIMITS.usernameMin, MODZ_FIELD_LIMITS.usernameMax);
    if (!result.ok) return result;
    if (!/^[a-z0-9_.]+$/i.test(result.value)) return { ok: false, reason: "استخدم حروفاً وأرقاماً و_ و . فقط" };
    return result;
  }

  function proValidatePost(value) {
    return proValidateText(value, 0, MODZ_FIELD_LIMITS.postTextMax);
  }

  function proValidateComment(value) {
    return proValidateText(value, 1, MODZ_FIELD_LIMITS.commentMax);
  }

  function proValidateMessage(value) {
    return proValidateText(value, 0, MODZ_FIELD_LIMITS.messageMax);
  }

  function proValidateMediaUrl(value) {
    if (!value) return { ok: true, value: "" };
    const safe = proSafeUrl(value.trim());
    if (!safe) return { ok: false, reason: "الرابط يجب أن يبدأ بـ http أو https" };
    return { ok: true, value: safe };
  }

  function proValidateImageSize(file) {
    if (!file) return { ok: true };
    if (!file.type.startsWith("image/")) return { ok: false, reason: "الملف ليس صورة" };
    if (file.size > MODZ_FIELD_LIMITS.smallImageBytes) return { ok: false, reason: "الصورة أكبر من 650KB" };
    return { ok: true };
  }

<!--
  MODZ WEB PRO — LIVE DATABASE CONTRACT
  هذا القسم جزء من الملف الواحد لتوثيق البنية المستخدمة فعلياً في Firestore.
  users/{uid}: profile, friends, online, lastSeen.
  users/{uid}/bookmarks/{postId}: saved post reference.
  posts/{postId}: feed content, media URLs, author snapshot and timestamps.
  posts/{postId}/likes/{uid}: one like document per authenticated user.
  posts/{postId}/comments/{commentId}: comments and author snapshot.
  friendRequests/{id}: sender, recipient, status and request metadata.
  conversations/{id}: exactly two participants, names, avatars, unread counters.
  conversations/{id}/messages/{id}: text, optional attachment, read state and reactions.
  notifications/{id}: recipient, sender, type, reference and read flag.
  No Firebase Storage SDK is loaded by this version.
  Small local image attachments are encoded as Data URLs before being written to Firestore.
  Large media should be represented by a direct HTTPS URL so Firestore document limits are respected.
  The Firebase Web configuration in this file is intended for client initialization; security is provided by Rules.
  Never place a service-account JSON, private key, or Admin SDK credentials in this HTML file.
  Authentication must be enabled with Email/Password in Firebase Authentication.
  Firestore Rules should be deployed before opening the production site to untrusted users.
  Indexes are supplied separately for the compound queries used by the app.
  Presence uses a heartbeat timestamp and a lastSeen fallback rather than a privileged server.
  Notifications are written by the authenticated actor and read by the recipient.
  Message deletion is sender-scoped; read receipts can be updated by the conversation participant.
  Post editing and deletion are owner-scoped.
  Like documents are keyed by UID to make duplicate likes impossible.
  Friend request creation is sender-scoped and response is recipient-scoped.
  Conversation IDs are deterministic from the two participant UIDs.
  Offline persistence is enabled when the browser supports IndexedDB persistence.
  The UI unsubscribes realtime listeners when switching tabs to reduce unnecessary reads.
  Search uses username prefix queries and bounded recent-post scanning.
  Browser notifications remain optional and require explicit permission.
  Local theme and draft settings use localStorage and do not require additional Firestore collections.
  This contract intentionally avoids Storage Rules because Storage is not used by the current build.
  If you later add Firebase Storage, create separate Storage Rules before enabling uploads.
  If Firestore reports a missing index, use the supplied firestore.indexes.json or the generated Firebase link.
  The schema is intentionally simple so the app can be hosted as one static HTML file.
  The app is designed for mobile-first usage but remains responsive on larger screens.
  Security Rules must remain the source of truth for authorization; client-side checks are only UX.
  End of live database contract.
-->
