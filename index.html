<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Modz Web | منصة التواصل والتسوق</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --bg-primary: #0a0e1a;
      --bg-secondary: #111827;
      --bg-card: #1a2234;
      --bg-elevated: #1f2a3f;
      --accent-purple: #8b5cf6;
      --accent-blue: #3b82f6;
      --accent-pink: #ec4899;
      --accent-gold: #f59e0b;
      --accent-green: #10b981;
      --danger: #ef4444;
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      --border-color: rgba(255, 255, 255, 0.1);
      --border-light: rgba(255, 255, 255, 0.05);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
      --gradient-primary: linear-gradient(135deg, #8b5cf6, #3b82f6);
      --gradient-accent: linear-gradient(135deg, #ec4899, #8b5cf6);
      --gradient-gold: linear-gradient(135deg, #f59e0b, #ef4444);
      --gradient-danger: linear-gradient(135deg, #ef4444, #b91c1c);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-full: 50px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Tajawal', 'Cairo', sans-serif;
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
      padding-bottom: 80px;
    }
    h1, h2, h3, h4, h5, h6, .brand, .auth-title, .section-title { font-family: 'Cairo', sans-serif; }
    button, input, textarea, select { font-family: inherit; }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--bg-elevated); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-purple); }

    #offline-banner {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 9999;
      background: var(--gradient-gold);
      color: #fff;
      text-align: center;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 700;
      animation: slideDown 0.5s ease;
      box-shadow: var(--shadow-lg);
    }
    #offline-banner.show { display: block; }

    #top-header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: rgba(10, 14, 26, 0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-color);
    }
    .brand {
      font-weight: 900;
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-actions { display: flex; gap: 8px; }
    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      transition: var(--transition);
    }
    .icon-btn:hover { background: var(--accent-purple); color: #fff; border-color: var(--accent-purple); }

    #app { max-width: 720px; margin: 0 auto; position: relative; }
    #screen-body { padding: 16px 14px 30px; }

    .auth-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 18px;
      background: linear-gradient(135deg, #0a0e1a 0%, #1a2234 50%, #0a0e1a 100%);
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(165deg, var(--bg-card), var(--bg-secondary));
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 40px 30px;
      box-shadow: var(--shadow-lg);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .auth-title {
      font-weight: 900;
      font-size: 30px;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .auth-sub {
      color: var(--text-secondary);
      font-size: 13.5px;
      margin-top: 4px;
      margin-bottom: 24px;
    }
    .auth-tabs {
      display: flex;
      background: var(--bg-elevated);
      border-radius: var(--radius-full);
      padding: 4px;
      margin-bottom: 20px;
    }
    .auth-tab {
      flex: 1;
      padding: 10px;
      border: none;
      background: none;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 13.5px;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: var(--transition);
    }
    .auth-tab.active { background: var(--gradient-primary); color: #fff; }
    .auth-form { display: flex; flex-direction: column; gap: 14px; text-align: right; }
    .auth-error { color: var(--danger); font-size: 13px; min-height: 18px; text-align: center; font-weight: 600; }
    .auth-note { margin-top: 16px; font-size: 11px; color: var(--text-muted); line-height: 1.6; }

    .form-field label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 600; }
    .form-field input, .form-field textarea, .form-field select {
      width: 100%;
      background: var(--bg-elevated);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
      transition: var(--transition);
    }
    .form-field textarea { min-height: 90px; resize: vertical; }
    .form-field input:focus, .form-field textarea:focus, .form-field select:focus {
      border-color: var(--accent-purple);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
    }
    .primary-btn {
      width: 100%;
      padding: 13px;
      border-radius: var(--radius-md);
      border: none;
      background: var(--gradient-primary);
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      transition: var(--transition);
    }
    .primary-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(139, 92, 246, 0.4); }
    .primary-btn.danger { background: var(--gradient-danger); }

    .composer-teaser {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      margin-bottom: 20px;
      cursor: pointer;
      transition: var(--transition);
    }
    .composer-teaser:hover { border-color: var(--accent-purple); box-shadow: 0 4px 20px rgba(139, 92, 246, 0.3); }
    .teaser-text { flex: 1; color: var(--text-muted); font-size: 14px; }
    .teaser-icon { font-size: 18px; color: var(--accent-purple); }

    .mini-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--gradient-primary);
      color: #fff;
      font-weight: 800;
      font-size: 17px;
      border: 2px solid var(--accent-purple);
    }
    .mini-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .mini-avatar.small { width: 32px; height: 32px; font-size: 13px; border-width: 1px; }

    .posts-list { display: flex; flex-direction: column; gap: 16px; }
    .post-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 16px;
      transition: var(--transition);
    }
    .post-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .post-head-text { flex: 1; }
    .post-author { font-weight: 800; font-size: 14.5px; color: var(--text-primary); }
    .post-time { font-size: 11.5px; color: var(--text-muted); margin-top: 1px; }
    .post-delete-btn { background: none; border: none; color: var(--text-muted); font-size: 15px; cursor: pointer; padding: 4px; transition: var(--transition); }
    .post-delete-btn:hover { color: var(--danger); }
    .post-content { font-size: 14.5px; line-height: 1.8; color: var(--text-primary); white-space: pre-wrap; word-break: break-word; }
    .post-image { margin-top: 12px; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-color); max-height: 400px; }
    .post-image img { width: 100%; height: 100%; object-fit: cover; }
    .post-actions { display: flex; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border-light); }
    .post-action {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: var(--radius-full);
      border: none;
      background: var(--bg-elevated);
      color: var(--text-secondary);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
    }
    .post-action:hover { background: rgba(139, 92, 246, 0.2); color: var(--accent-purple); }
    .like-btn[data-liked="1"] { color: var(--accent-pink); background: rgba(236, 72, 153, 0.15); }
    .comments-section { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border-color); }
    .comments-list { display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; margin-bottom: 10px; }
    .comment-row { display: flex; gap: 8px; align-items: flex-start; }
    .comment-bubble { background: var(--bg-elevated); border-radius: var(--radius-md); padding: 8px 12px; flex: 1; }
    .comment-author { font-size: 11.5px; font-weight: 700; color: var(--accent-purple); }
    .comment-text { font-size: 12.5px; color: var(--text-secondary); margin-top: 1px; line-height: 1.6; }
    .comment-form { display: flex; gap: 8px; }
    .comment-form input {
      flex: 1;
      background: var(--bg-elevated);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-full);
      padding: 8px 14px;
      color: var(--text-primary);
      font-size: 12.5px;
      outline: none;
    }
    .comment-form button {
      padding: 8px 16px;
      border-radius: var(--radius-full);
      border: none;
      background: var(--gradient-primary);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 13.5px;
      padding: 40px 20px;
      border: 2px dashed var(--border-color);
      border-radius: var(--radius-lg);
    }

    .messages-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .new-chat-btn {
      padding: 8px 16px;
      border-radius: var(--radius-full);
      border: 1px solid var(--accent-purple);
      background: rgba(139, 92, 246, 0.15);
      color: var(--accent-purple);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .convos-list { display: flex; flex-direction: column; gap: 10px; }
    .convo-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      cursor: pointer;
      transition: var(--transition);
    }
    .convo-row:hover { border-color: var(--accent-purple); background: var(--bg-elevated); }
    .convo-mid { flex: 1; min-width: 0; }
    .convo-name { font-weight: 700; font-size: 13.5px; color: var(--text-primary); }
    .convo-preview { font-size: 12px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .convo-time { font-size: 10.5px; color: var(--text-muted); flex-shrink: 0; }
    .search-results { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; max-height: 300px; overflow-y: auto; }

    .chat-screen { display: flex; flex-direction: column; height: calc(100vh - 140px); margin: -16px -14px 0; }
    .chat-header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); }
    .chat-back-btn {
      width: 34px; height: 34px; border-radius: 50%; background: var(--bg-card); border: 1px solid var(--border-color);
      color: var(--text-primary); display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .chat-bubble-row { display: flex; }
    .chat-bubble-row.mine { justify-content: flex-end; }
    .chat-bubble-row.theirs { justify-content: flex-start; }
    .chat-bubble {
      max-width: 75%; padding: 10px 14px; border-radius: 16px; font-size: 13.5px; line-height: 1.6;
      word-break: break-word; background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-primary);
    }
    .chat-bubble-row.mine .chat-bubble { background: var(--gradient-primary); border-color: transparent; color: #fff; }
    .chat-input-form { display: flex; gap: 8px; padding: 12px; background: var(--bg-secondary); border-top: 1px solid var(--border-color); }
    .chat-input-form input { flex: 1; background: var(--bg-elevated); border: 1px solid var(--border-color); border-radius: var(--radius-full); padding: 10px 16px; color: var(--text-primary); font-size: 13.5px; outline: none; }
    .chat-input-form button { padding: 10px 20px; border-radius: var(--radius-full); border: none; background: var(--gradient-primary); color: #fff; font-weight: 700; cursor: pointer; }

    .profile-card { text-align: center; padding: 16px 0 20px; }
    .profile-avatar-big {
      width: 90px; height: 90px; border-radius: 50%; margin: 0 auto 12px; overflow: hidden;
      display: flex; align-items: center; justify-content: center; background: var(--gradient-primary);
      color: #fff; font-weight: 900; font-size: 32px; border: 3px solid var(--accent-purple); box-shadow: 0 8px 30px rgba(139, 92, 246, 0.4);
    }
    .profile-avatar-big img { width: 100%; height: 100%; object-fit: cover; }
    .profile-username { color: var(--text-muted); font-size: 13px; margin-top: 2px; }
    .profile-form, .admin-card {
      display: flex; flex-direction: column; gap: 14px; background: var(--bg-card);
      border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 18px; margin-bottom: 20px;
    }
    .section-title { font-weight: 800; font-size: 15px; margin-bottom: 12px; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
    .section-title i { color: var(--accent-purple); }
    .btn-row { display: flex; gap: 10px; margin-bottom: 16px; }
    .secondary-btn {
      flex: 1; padding: 11px; border-radius: var(--radius-md); border: 1px solid var(--border-color);
      background: var(--bg-elevated); color: var(--text-primary); font-weight: 700; font-size: 13px; cursor: pointer; text-align: center;
    }
    .secondary-btn:hover { border-color: var(--accent-purple); color: var(--accent-purple); }

    .logout-btn {
      width: 100%; margin-top: 10px; padding: 12px; border-radius: var(--radius-md);
      border: 1px solid rgba(239, 68, 68, 0.4); background: rgba(239, 68, 68, 0.1);
      color: var(--danger); font-weight: 800; font-size: 13.5px; cursor: pointer;
    }

    .tab-bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 90; display: flex;
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); background: rgba(10, 14, 26, 0.95);
      backdrop-filter: blur(20px); border-top: 1px solid var(--border-color); max-width: 720px; margin: 0 auto;
    }
    .tab-item {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 6px 2px; background: none; border: none; color: var(--text-muted); font-size: 10.5px; font-weight: 600; cursor: pointer;
    }
    .tab-item .tab-ic { font-size: 20px; }
    .tab-item.active { color: var(--accent-purple); }
    .tab-item.compose-tab .tab-ic {
      background: var(--gradient-primary); width: 42px; height: 42px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; color: #fff; margin: -18px auto 0;
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5); font-size: 18px;
    }

    .modal-overlay {
      position: fixed; inset: 0; z-index: 200; background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px); display: flex; align-items: flex-end; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    @media(min-width: 640px) { .modal-overlay { align-items: center; padding: 20px; } }
    .modal-overlay.show { opacity: 1; pointer-events: all; }
    .modal {
      width: 100%; max-width: 500px; background: var(--bg-secondary); border: 1px solid var(--border-color);
      border-radius: 20px 20px 0 0; padding: 24px 20px 28px; position: relative;
      transform: translateY(30px); transition: transform 0.3s ease; max-height: 85vh; overflow-y: auto;
    }
    @media(min-width: 640px) { .modal { border-radius: 20px; transform: translateY(0); } }
    .modal-overlay.show .modal { transform: translateY(0); }
    .modal-close {
      position: absolute; top: 14px; left: 14px; width: 32px; height: 32px; border-radius: 50%;
      background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-secondary);
      display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 15px;
    }
    .modal-title { text-align: center; font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 18px; margin-bottom: 18px; color: var(--accent-purple); }

    .toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--bg-elevated); border: 1px solid var(--accent-purple); color: var(--text-primary);
      padding: 12px 20px; border-radius: var(--radius-full); font-size: 13.5px; z-index: 300;
      opacity: 0; transition: all 0.3s ease; pointer-events: none; text-align: center; max-width: 90vw; box-shadow: var(--shadow-lg); font-weight: 600;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .friend-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); margin-bottom: 8px; }
    .friend-info { flex: 1; }
    .friend-name { font-weight: 700; font-size: 13.5px; }
    .friend-username { font-size: 11.5px; color: var(--text-muted); }
    .message-friend-btn { padding: 7px 14px; border-radius: var(--radius-full); border: 1px solid var(--accent-purple); background: rgba(139, 92, 246, 0.15); color: var(--accent-purple); font-size: 12px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

<div id="offline-banner"><i class="fas fa-wifi"></i> أنت غير متصل بالإنترنت — تحقق من الاتصال</div>
<div id="app"></div>

<nav class="tab-bar" id="main-tabbar" style="display:none;">
  <button class="tab-item" data-tab="feed"><span class="tab-ic">🏠</span>الرئيسية</button>
  <button class="tab-item" data-tab="messages"><span class="tab-ic">💬</span>الرسائل</button>
  <button class="tab-item compose-tab" data-tab="compose"><span class="tab-ic">＋</span></button>
  <button class="tab-item" data-tab="friends"><span class="tab-ic">👥</span>الأصدقاء</button>
  <button class="tab-item" data-tab="profile"><span class="tab-ic">👤</span>حسابي</button>
</nav>

<!-- Modal: المنشورات -->
<div class="modal-overlay" id="composer-modal">
  <div class="modal">
    <div class="modal-close" data-close>✕</div>
    <div class="modal-title">إنشاء منشور جديد</div>
    <form id="composer-form" style="display:flex; flex-direction:column; gap:14px;">
      <div class="form-field"><textarea id="composer-content" placeholder="بم تفكر الآن؟" maxlength="1000"></textarea></div>
      <div class="form-field"><label>رابط صورة (اختياري)</label><input type="text" id="composer-image-url" placeholder="https://..."></div>
      <button type="submit" class="primary-btn" id="composer-submit-btn"><i class="fas fa-paper-plane"></i> نشر</button>
    </form>
  </div>
</div>

<!-- Modal: محادثة جديدة -->
<div class="modal-overlay" id="new-chat-modal">
  <div class="modal">
    <div class="modal-close" data-close>✕</div>
    <div class="modal-title">محادثة جديدة</div>
    <div class="form-field"><input type="text" id="search-username-input" placeholder="ابحث باسم المستخدم..."></div>
    <div id="search-results" class="search-results"></div>
  </div>
</div>

<!-- Modal: الإبلاغ عن مشكلة / التواصل مع المطور -->
<div class="modal-overlay" id="support-modal">
  <div class="modal">
    <div class="modal-close" data-close>✕</div>
    <div class="modal-title" id="support-modal-title">التواصل والإبلاغ</div>
    <form id="support-form" style="display:flex; flex-direction:column; gap:14px;">
      <div class="form-field">
        <label>نوع الرسالة</label>
        <select id="support-type">
          <option value="problem">إبلاغ عن مشكلة / خافية</option>
          <option value="developer">تواصل مباشر مع المطور</option>
          <option value="suggestion">اقتراح ميزة جديدة</option>
        </select>
      </div>
      <div class="form-field">
        <label>تفاصيل الرسالة</label>
        <textarea id="support-content" placeholder="اكتب الاستفسار أو تفاصيل المشكلة هنا..." required></textarea>
      </div>
      <button type="submit" class="primary-btn" id="support-submit-btn"><i class="fas fa-paper-plane"></i> إرسال إلى المطور</button>
    </form>
  </div>
</div>

<!-- Modal: لوحة تحكم المطور (Banning Users) -->
<div class="modal-overlay" id="admin-modal">
  <div class="modal">
    <div class="modal-close" data-close>✕</div>
    <div class="modal-title" style="color:var(--danger);"><i class="fas fa-user-shield"></i> لوحة المطور - طرد مستخدم</div>
    <div class="admin-card">
      <div class="form-field">
        <label>معرّف المستخدم (UID)</label>
        <input type="text" id="admin-target-uid" placeholder="أدخل UID المستخدم هنا">
      </div>
      <button type="button" class="primary-btn danger" id="admin-ban-btn"><i class="fas fa-ban"></i> حظر وطرد المستخدم</button>
      <button type="button" class="secondary-btn" id="admin-unban-btn" style="margin-top:6px;">إلغاء حظر المستخدم</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, deleteDoc, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCfPtxGjvMhlR0vOILq1PXajM3V5Xgnxsc",
    authDomain: "modz-aec01.firebaseapp.com",
    projectId: "modz-aec01",
    storageBucket: "modz-aec01.firebasestorage.app",
    messagingSenderId: "828089759139",
    appId: "1:828089759139:web:c2829c23d461ee81d89616"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // قائمة الكلمات المسيئة لمنعها تلقائياً
  const BAD_WORDS = ["احمق", "غبي", "كلب", "حمار", "وسخ", "قذر", "شتيمة", "fool", "dog", "stupid"];
  function filterProfanity(text) {
    if (!text) return "";
    let cleaned = text;
    BAD_WORDS.forEach(word => {
      const regex = new RegExp(word, "gi");
      cleaned = cleaned.replace(regex, "***");
    });
    return cleaned;
  }

  let currentUser = null;
  let currentProfile = null;
  let feedUnsub = null;
  let currentTab = "feed";
  let convosUnsub = null;
  let messagesUnsub = null;
  let currentChat = null;
  let friendsUnsub = null;

  function conversationIdFor(uidA, uidB) { return [uidA, uidB].sort().join("_"); }
  function $(sel) { return document.querySelector(sel); }
  function $id(id) { return document.getElementById(id); }
  function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
  function escapeHtml(s) { return (s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function timeAgo(ts) { if (!ts) return "الآن"; const date = ts.toDate ? ts.toDate() : new Date(ts); const diff = Math.floor((Date.now() - date.getTime()) / 1000); if (diff < 60) return "الآن"; if (diff < 3600) return `منذ ${Math.floor(diff / 60)} د`; if (diff < 86400) return `منذ ${Math.floor(diff / 3600)} س`; return date.toLocaleDateString("ar-EG"); }
  function showToast(msg) { const t = $id("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(showToast._t); showToast._t = setTimeout(() => t.classList.remove("show"), 3000); }
  function setLoading(btn, loading, labelDefault) { if (loading) { btn.disabled = true; btn.dataset.label = btn.textContent; btn.textContent = "..."; } else { btn.disabled = false; btn.textContent = labelDefault || btn.dataset.label || btn.textContent; } }
  function avatarFallback(name) { return (name || "؟").trim().charAt(0).toUpperCase(); }

  let authMode = "login";
  function renderAuthScreen() {
    const root = $id("app");
    root.innerHTML = `
      <div class="auth-wrap">
        <div class="auth-card">
          <h1 class="auth-title">Modz Web</h1>
          <p class="auth-sub">منصة التواصل الاجتماعي والتسوق</p>
          <div class="auth-tabs">
            <button class="auth-tab ${authMode === "login" ? "active" : ""}" data-mode="login">تسجيل الدخول</button>
            <button class="auth-tab ${authMode === "signup" ? "active" : ""}" data-mode="signup">حساب جديد</button>
          </div>
          <form id="auth-form" class="auth-form">
            <div class="form-field" id="field-username" style="display:${authMode === "signup" ? "block" : "none"}">
              <label>اسم المستخدم</label>
              <input type="text" id="auth-username" placeholder="مثال: sara_2026" ${authMode === "signup" ? "required" : ""}>
            </div>
            <div class="form-field">
              <label>البريد الإلكتروني</label>
              <input type="email" id="auth-email" placeholder="you@example.com" required>
            </div>
            <div class="form-field">
              <label>كلمة المرور</label>
              <input type="password" id="auth-password" placeholder="••••••••" required minlength="6">
            </div>
            <p class="auth-error" id="auth-error"></p>
            <button type="submit" class="primary-btn" id="auth-submit-btn">${authMode === "login" ? "دخول" : "إنشاء الحساب"}</button>
          </form>
          <p class="auth-note">بالمتابعة أنت توافق على الالتزام بآداب المجتمع وشروط الخدمة.</p>
        </div>
      </div>
    `;
    root.querySelectorAll(".auth-tab").forEach(t => { t.addEventListener("click", () => { authMode = t.dataset.mode; renderAuthScreen(); }); });
    $id("auth-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = $id("auth-email").value.trim();
      const password = $id("auth-password").value;
      const username = authMode === "signup" ? $id("auth-username").value.trim().toLowerCase().replace(/[^a-z0-9_\.]/g, "") : "";
      const errBox = $id("auth-error");
      const btn = $id("auth-submit-btn");
      errBox.textContent = "";
      setLoading(btn, true);
      try {
        if (authMode === "signup") {
          if (!username || username.length < 3) throw { message: "اسم المستخدم يجب أن يتكون من 3 حروف على الأقل." };
          const cred = await createUserWithEmailAndPassword(auth, email, password);
          await updateProfile(cred.user, { displayName: username });
          
          // الحفظ في قاعدة البيانات بعد النجاح
          await setDoc(doc(db, "users", cred.user.uid), {
            username,
            displayName: username,
            avatarUrl: "",
            bio: "",
            isBanned: false,
            isAdmin: false,
            createdAt: serverTimestamp()
          });
          showToast("تم إنشاء الحساب بنجاح 🎉");
        } else {
          await signInWithEmailAndPassword(auth, email, password);
          showToast("أهلاً بعودتك 👋");
        }
      } catch (err) {
        errBox.textContent = err.message || "حدث خطأ أثناء الدخول، يرجى المحاولة لاحقاً.";
        setLoading(btn, false, authMode === "login" ? "دخول" : "إنشاء الحساب");
      }
    });
  }

  function renderShell() {
    const root = $id("app");
    root.innerHTML = `
      <div id="top-header">
        <div class="brand"><i class="fas fa-globe"></i> Modz Web</div>
        <div class="header-actions">
          <button id="header-support-btn" class="icon-btn" title="تواصل وتسهيلات / إبلاغ"><i class="fas fa-headset"></i></button>
          <button id="header-notice-btn" class="icon-btn" title="حالة الاتصال"><i class="fas fa-wifi"></i></button>
        </div>
      </div>
      <div id="screen-body"></div>
    `;
    paintTab(currentTab);
    $id("header-support-btn").addEventListener("click", () => openModal("support-modal"));
    $id("header-notice-btn").addEventListener("click", () => { showToast(navigator.onLine ? "أنت متصل بالإنترنت ✅" : "لا يوجد اتصال بالإنترنت 📶"); });
  }

  function paintTab(tab) {
    currentTab = tab;
    currentChat = null;
    document.querySelectorAll(".tab-item").forEach(t => t.classList.toggle("active", t.dataset.tab === tab));
    const body = $id("screen-body");
    if (!body) return;
    body.innerHTML = "";
    if (feedUnsub) { feedUnsub(); feedUnsub = null; }
    if (convosUnsub) { convosUnsub(); convosUnsub = null; }
    if (messagesUnsub) { messagesUnsub(); messagesUnsub = null; }
    if (friendsUnsub) { friendsUnsub(); friendsUnsub = null; }

    if (tab === "feed") body.appendChild(renderFeedScreen());
    else if (tab === "profile") body.appendChild(renderProfileScreen());
    else if (tab === "messages") body.appendChild(renderMessagesScreen());
    else if (tab === "friends") body.appendChild(renderFriendsScreen());
  }

  document.addEventListener("click", (e) => {
    const tabBtn = e.target.closest(".tab-item");
    if (tabBtn) {
      if (tabBtn.dataset.tab === "compose") { openComposer(); return; }
      paintTab(tabBtn.dataset.tab);
    }
  });

  function renderFeedScreen() {
    const wrap = el("div", "feed-screen");
    wrap.innerHTML = `
      <div class="composer-teaser" id="composer-teaser">
        <div class="mini-avatar">${currentProfile && currentProfile.avatarUrl ? `<img src="${escapeHtml(currentProfile.avatarUrl)}">` : avatarFallback(currentProfile && currentProfile.displayName)}</div>
        <div class="teaser-text">بم تفكر الآن؟</div>
        <div class="teaser-icon"><i class="fas fa-pen"></i></div>
      </div>
      <div id="posts-list" class="posts-list"></div>
      <div id="feed-empty" class="empty-state" style="display:none;">لا توجد منشورات بعد — كن أول من ينشر! ✨</div>
    `;
    wrap.querySelector("#composer-teaser").addEventListener("click", openComposer);
    const listEl = wrap.querySelector("#posts-list");
    const emptyEl = wrap.querySelector("#feed-empty");
    const q = query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(50));
    feedUnsub = onSnapshot(q, (snap) => {
      listEl.innerHTML = "";
      if (snap.empty) { emptyEl.style.display = "block"; return; }
      emptyEl.style.display = "none";
      snap.forEach(docSnap => listEl.appendChild(renderPostCard(docSnap.id, docSnap.data())));
    }, (err) => { emptyEl.style.display = "block"; emptyEl.textContent = "لا توجد منشورات بعد."; });
    return wrap;
  }

  function renderPostCard(postId, post) {
    const card = el("div", "post-card");
    const isOwner = currentUser && (post.uid === currentUser.uid || (currentProfile && currentProfile.isAdmin));
    card.innerHTML = `
      <div class="post-head">
        <div class="mini-avatar">${post.authorAvatar ? `<img src="${escapeHtml(post.authorAvatar)}">` : avatarFallback(post.authorName)}</div>
        <div class="post-head-text">
          <div class="post-author">${escapeHtml(post.authorName || "مستخدم")}</div>
          <div class="post-time">${timeAgo(post.createdAt)}</div>
        </div>
        ${isOwner ? `<button class="post-delete-btn" title="حذف"><i class="fas fa-trash"></i></button>` : ""}
      </div>
      <div class="post-content">${escapeHtml(filterProfanity(post.content || ""))}</div>
      ${post.imageUrl ? `<div class="post-image"><img src="${escapeHtml(post.imageUrl)}" loading="lazy"></div>` : ""}
      <div class="post-actions">
        <button class="post-action like-btn"><span class="like-ic">🤍</span><span class="like-count">0</span></button>
        <button class="post-action comment-btn"><i class="fas fa-comment"></i><span class="comment-count">0</span></button>
      </div>
      <div class="comments-section" style="display:none;">
        <div class="comments-list"></div>
        <form class="comment-form">
          <input type="text" placeholder="اكتب تعليقاً (تمنع الكلمات المسيئة)..." class="comment-input" maxlength="300">
          <button type="submit"><i class="fas fa-paper-plane"></i></button>
        </form>
      </div>
    `;
    if (isOwner) {
      card.querySelector(".post-delete-btn").addEventListener("click", async () => {
        if (confirm("هل تريد حذف هذا المنشور؟")) {
          try { await deleteDoc(doc(db, "posts", postId)); showToast("تم حذف المنشور"); }
          catch (e) { showToast("تعذر الحذف."); }
        }
      });
    }
    const likesCol = collection(db, "posts", postId, "likes");
    const likeBtn = card.querySelector(".like-btn");
    const likeIc = card.querySelector(".like-ic");
    const likeCountEl = card.querySelector(".like-count");
    onSnapshot(likesCol, (snap) => {
      likeCountEl.textContent = snap.size;
      const likedByMe = currentUser && snap.docs.some(d => d.id === currentUser.uid);
      likeIc.textContent = likedByMe ? "❤️" : "🤍";
      likeBtn.dataset.liked = likedByMe ? "1" : "0";
    });
    likeBtn.addEventListener("click", async () => {
      const likeRef = doc(db, "posts", postId, "likes", currentUser.uid);
      try {
        if (likeBtn.dataset.liked === "1") await deleteDoc(likeRef);
        else await setDoc(likeRef, { createdAt: serverTimestamp() });
      } catch (e) { showToast("تعذر التفاعل."); }
    });

    const commentsCol = collection(db, "posts", postId, "comments");
    const commentCountEl = card.querySelector(".comment-count");
    const commentsSection = card.querySelector(".comments-section");
    const commentsListEl = card.querySelector(".comments-list");
    let commentsOpen = false;
    onSnapshot(query(commentsCol, orderBy("createdAt", "asc")), (snap) => {
      commentCountEl.textContent = snap.size;
      if (commentsOpen) {
        commentsListEl.innerHTML = "";
        snap.forEach(c => {
          const cd = c.data();
          const row = el("div", "comment-row");
          row.innerHTML = `
            <div class="mini-avatar small">${cd.authorAvatar ? `<img src="${escapeHtml(cd.authorAvatar)}">` : avatarFallback(cd.authorName)}</div>
            <div class="comment-bubble">
              <div class="comment-author">${escapeHtml(cd.authorName || "مستخدم")}</div>
              <div class="comment-text">${escapeHtml(filterProfanity(cd.content || ""))}</div>
            </div>
          `;
          commentsListEl.appendChild(row);
        });
      }
    });
    card.querySelector(".comment-btn").addEventListener("click", () => {
      commentsOpen = !commentsOpen;
      commentsSection.style.display = commentsOpen ? "block" : "none";
    });
    card.querySelector(".comment-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = card.querySelector(".comment-input");
      const text = filterProfanity(input.value.trim());
      if (!text) return;
      input.value = "";
      try {
        await addDoc(commentsCol, {
          uid: currentUser.uid,
          authorName: currentProfile.displayName || currentProfile.username,
          authorAvatar: currentProfile.avatarUrl || "",
          content: text,
          createdAt: serverTimestamp()
        });
      } catch (err) { showToast("تعذر إرسال التعليق."); }
    });
    return card;
  }

  function openComposer() {
    $id("composer-content").value = "";
    $id("composer-image-url").value = "";
    openModal("composer-modal");
  }

  function wireComposer() {
    $id("composer-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const content = filterProfanity($id("composer-content").value.trim());
      const imageUrl = $id("composer-image-url").value.trim();
      if (!content && !imageUrl) { showToast("اكتب شيئاً أولاً ✍️"); return; }
      const btn = $id("composer-submit-btn");
      setLoading(btn, true);
      try {
        await addDoc(collection(db, "posts"), {
          uid: currentUser.uid,
          authorName: currentProfile.displayName || currentProfile.username,
          authorAvatar: currentProfile.avatarUrl || "",
          content, imageUrl: imageUrl || "",
          createdAt: serverTimestamp()
        });
        closeModal("composer-modal");
        showToast("تم النشر بنجاح ✅");
      } catch (err) { showToast("تعذر النشر."); }
      setLoading(btn, false, "نشر");
    });
  }

  function renderMessagesScreen() {
    const wrap = el("div", "messages-screen");
    wrap.innerHTML = `
      <div class="messages-top">
        <div class="section-title"><i class="fas fa-comments"></i> الرسائل</div>
        <button class="new-chat-btn" id="new-chat-btn"><i class="fas fa-plus"></i> محادثة جديدة</button>
      </div>
      <div id="convos-list" class="convos-list"></div>
      <div id="convos-empty" class="empty-state" style="display:none;">لا توجد محادثات بعد ✉️</div>
    `;
    wrap.querySelector("#new-chat-btn").addEventListener("click", () => openModal("new-chat-modal"));
    const listEl = wrap.querySelector("#convos-list");
    const emptyEl = wrap.querySelector("#convos-empty");

    const q = query(collection(db, "conversations"), where("participants", "array-contains", currentUser.uid));
    convosUnsub = onSnapshot(q, (snap) => {
      listEl.innerHTML = "";
      if (snap.empty) { emptyEl.style.display = "block"; return; }
      emptyEl.style.display = "none";

      let docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      docs.sort((a, b) => (b.lastMessageAt?.seconds || 0) - (a.lastMessageAt?.seconds || 0));

      docs.forEach(conv => {
        const otherUid = conv.participants.find(p => p !== currentUser.uid);
        if (!otherUid) return;
        const otherName = (conv.participantNames && conv.participantNames[otherUid]) || "مستخدم";
        const otherAvatar = (conv.participantAvatars && conv.participantAvatars[otherUid]) || "";
        const row = el("div", "convo-row");
        row.innerHTML = `
          <div class="mini-avatar">${otherAvatar ? `<img src="${escapeHtml(otherAvatar)}">` : avatarFallback(otherName)}</div>
          <div class="convo-mid">
            <div class="convo-name">${escapeHtml(otherName)}</div>
            <div class="convo-preview">${escapeHtml(filterProfanity(conv.lastMessage || ""))}</div>
          </div>
          <div class="convo-time">${timeAgo(conv.lastMessageAt)}</div>
        `;
        row.addEventListener("click", () => openChat(conv.id, { uid: otherUid, displayName: otherName, avatarUrl: otherAvatar }));
        listEl.appendChild(row);
      });
    }, (err) => { emptyEl.style.display = "block"; emptyEl.textContent = "لا توجد محادثات."; });
    return wrap;
  }

  function openChat(conversationId, otherUser) {
    currentChat = { conversationId, otherUser };
    if (convosUnsub) { convosUnsub(); convosUnsub = null; }
    const body = $id("screen-body");
    body.innerHTML = "";
    body.appendChild(renderChatScreen(conversationId, otherUser));
  }

  function renderChatScreen(conversationId, otherUser) {
    const wrap = el("div", "chat-screen");
    wrap.innerHTML = `
      <div class="chat-header">
        <button class="chat-back-btn" id="chat-back-btn"><i class="fas fa-arrow-right"></i></button>
        <div class="mini-avatar">${otherUser.avatarUrl ? `<img src="${escapeHtml(otherUser.avatarUrl)}">` : avatarFallback(otherUser.displayName)}</div>
        <div class="chat-header-name">${escapeHtml(otherUser.displayName)}</div>
      </div>
      <div class="chat-messages" id="chat-messages"></div>
      <form class="chat-input-form" id="chat-input-form">
        <input type="text" id="chat-input" placeholder="اكتب رسالة..." maxlength="1000" autocomplete="off">
        <button type="submit"><i class="fas fa-paper-plane"></i></button>
      </form>
    `;
    wrap.querySelector("#chat-back-btn").addEventListener("click", () => paintTab("messages"));
    const msgsEl = wrap.querySelector("#chat-messages");
    const mq = query(collection(db, "conversations", conversationId, "messages"), orderBy("createdAt", "asc"));
    messagesUnsub = onSnapshot(mq, (snap) => {
      msgsEl.innerHTML = "";
      snap.forEach(d => {
        const m = d.data();
        const mine = m.senderId === currentUser.uid;
        const bubble = el("div", "chat-bubble-row " + (mine ? "mine" : "theirs"));
        bubble.innerHTML = `<div class="chat-bubble">${escapeHtml(filterProfanity(m.text))}</div>`;
        msgsEl.appendChild(bubble);
      });
      msgsEl.scrollTop = msgsEl.scrollHeight;
    });
    wrap.querySelector("#chat-input-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = wrap.querySelector("#chat-input");
      const text = filterProfanity(input.value.trim());
      if (!text) return;
      input.value = "";
      try {
        await addDoc(collection(db, "conversations", conversationId, "messages"), { senderId: currentUser.uid, text, createdAt: serverTimestamp() });
        await updateDoc(doc(db, "conversations", conversationId), { lastMessage: text, lastMessageAt: serverTimestamp() });
      } catch (err) { showToast("تعذر إرسال الرسالة."); }
    });
    return wrap;
  }

  function renderFriendsScreen() {
    const wrap = el("div", "friends-screen");
    wrap.innerHTML = `
      <div class="section-title"><i class="fas fa-users"></i> الأصدقاء والجمهور</div>
      <div id="friends-list" class="friends-list"></div>
      <div id="friends-empty" class="empty-state" style="display:none;">لا يوجد مستخدمون متوفرون حالياً.</div>
    `;
    const listEl = wrap.querySelector("#friends-list");
    const emptyEl = wrap.querySelector("#friends-empty");
    friendsUnsub = onSnapshot(collection(db, "users"), (snap) => {
      listEl.innerHTML = "";
      const users = snap.docs.filter(d => d.id !== currentUser.uid && !d.data().isBanned);
      if (users.length === 0) { emptyEl.style.display = "block"; return; }
      emptyEl.style.display = "none";
      users.forEach(d => {
        const u = d.data();
        const row = el("div", "friend-row");
        row.innerHTML = `
          <div class="mini-avatar">${u.avatarUrl ? `<img src="${escapeHtml(u.avatarUrl)}">` : avatarFallback(u.displayName)}</div>
          <div class="friend-info">
            <div class="friend-name">${escapeHtml(u.displayName || u.username)}</div>
            <div class="friend-username">@${escapeHtml(u.username)}</div>
          </div>
          <button class="message-friend-btn"><i class="fas fa-comment"></i> مراسلة</button>
        `;
        row.querySelector(".message-friend-btn").addEventListener("click", async () => {
          const convId = conversationIdFor(currentUser.uid, d.id);
          const convRef = doc(db, "conversations", convId);
          const snapC = await getDoc(convRef);
          if (!snapC.exists()) {
            await setDoc(convRef, {
              participants: [currentUser.uid, d.id],
              participantNames: { [currentUser.uid]: currentProfile.displayName || currentProfile.username, [d.id]: u.displayName || u.username },
              participantAvatars: { [currentUser.uid]: currentProfile.avatarUrl || "", [d.id]: u.avatarUrl || "" },
              lastMessage: "", lastMessageAt: serverTimestamp(), createdAt: serverTimestamp()
            });
          }
          openChat(convId, { uid: d.id, displayName: u.displayName || u.username, avatarUrl: u.avatarUrl || "" });
        });
        listEl.appendChild(row);
      });
    });
    return wrap;
  }

  function renderProfileScreen() {
    const wrap = el("div", "profile-screen");
    const isAdmin = currentProfile && currentProfile.isAdmin;
    wrap.innerHTML = `
      <div class="profile-card">
        <div class="profile-avatar-big">${currentProfile.avatarUrl ? `<img src="${escapeHtml(currentProfile.avatarUrl)}">` : avatarFallback(currentProfile.displayName)}</div>
        <div class="profile-username">@${escapeHtml(currentProfile.username || "")}</div>
        <div style="font-size:11px; color:var(--text-muted); margin-top:4px;">UID: ${currentUser.uid}</div>
      </div>
      <div class="btn-row">
        <button class="secondary-btn" id="prof-support-btn"><i class="fas fa-bug"></i> الإبلاغ عن مشكلة</button>
        <button class="secondary-btn" id="prof-dev-btn"><i class="fas fa-code"></i> المطور</button>
      </div>
      ${isAdmin ? `<button class="primary-btn danger" id="prof-admin-btn" style="margin-bottom:16px;"><i class="fas fa-user-shield"></i> لوحة طرد / حظر مستخدم</button>` : ""}
      <form id="profile-form" class="profile-form">
        <div class="form-field"><label>الاسم الظاهر</label><input type="text" id="pf-display-name" value="${escapeHtml(currentProfile.displayName || "")}" maxlength="40"></div>
        <div class="form-field"><label>رابط الصورة الشخصية</label><input type="text" id="pf-avatar" value="${escapeHtml(currentProfile.avatarUrl || "")}" placeholder="https://..."></div>
        <div class="form-field"><label>نبذة عنك</label><textarea id="pf-bio" maxlength="160">${escapeHtml(currentProfile.bio || "")}</textarea></div>
        <button type="submit" class="primary-btn" id="pf-save-btn"><i class="fas fa-save"></i> حفظ التعديلات</button>
      </form>
      <button class="logout-btn" id="logout-btn"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</button>
    `;
    wrap.querySelector("#prof-support-btn").addEventListener("click", () => openModal("support-modal"));
    wrap.querySelector("#prof-dev-btn").addEventListener("click", () => openModal("support-modal"));
    if (isAdmin) {
      wrap.querySelector("#prof-admin-btn").addEventListener("click", () => openModal("admin-modal"));
    }
    wrap.querySelector("#profile-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = $id("pf-save-btn");
      setLoading(btn, true);
      const displayName = filterProfanity($id("pf-display-name").value.trim()) || currentProfile.username;
      const avatarUrl = $id("pf-avatar").value.trim();
      const bio = filterProfanity($id("pf-bio").value.trim());
      try {
        await updateDoc(doc(db, "users", currentUser.uid), { displayName, avatarUrl, bio });
        currentProfile = { ...currentProfile, displayName, avatarUrl, bio };
        showToast("تم حفظ الملف الشخصي ✅");
        paintTab("profile");
      } catch (err) { showToast("تعذر الحفظ."); setLoading(btn, false, "حفظ التعديلات"); }
    });
    wrap.querySelector("#logout-btn").addEventListener("click", async () => {
      if (confirm("هل تريد تسجيل الخروج؟")) await signOut(auth);
    });
    return wrap;
  }

  function openModal(id) { $id(id).classList.add("show"); }
  function closeModal(id) { $id(id).classList.remove("show"); }
  function wireModals() {
    document.querySelectorAll("[data-close]").forEach(elx => {
      elx.addEventListener("click", () => elx.closest(".modal-overlay").classList.remove("show"));
    });
    document.querySelectorAll(".modal-overlay").forEach(ov => {
      ov.addEventListener("click", e => { if (e.target === ov) ov.classList.remove("show"); });
    });

    $id("support-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const type = $id("support-type").value;
      const content = $id("support-content").value.trim();
      const btn = $id("support-submit-btn");
      setLoading(btn, true);
      try {
        await addDoc(collection(db, "reports"), {
          uid: currentUser ? currentUser.uid : "anonymous",
          type, content, createdAt: serverTimestamp()
        });
        closeModal("support-modal");
        $id("support-content").value = "";
        showToast("تم إرسال رسالتك للمطور بنجاح 📨");
      } catch (err) { showToast("تعذر الإرسال، حاول مجدداً."); }
      setLoading(btn, false, "إرسال إلى المطور");
    });

    $id("admin-ban-btn").addEventListener("click", async () => {
      const targetUid = $id("admin-target-uid").value.trim();
      if (!targetUid) { showToast("أدخل UID المستخدم أولاً"); return; }
      try {
        await updateDoc(doc(db, "users", targetUid), { isBanned: true });
        showToast("تم حظر وطرد المستخدم بنجاح 🚫");
        closeModal("admin-modal");
      } catch (err) { showToast("خطأ: تعذر الحظر."); }
    });
    $id("admin-unban-btn").addEventListener("click", async () => {
      const targetUid = $id("admin-target-uid").value.trim();
      if (!targetUid) { showToast("أدخل UID المستخدم أولاً"); return; }
      try {
        await updateDoc(doc(db, "users", targetUid), { isBanned: false });
        showToast("تم إلغاء الحظر بنجاح ✅");
        closeModal("admin-modal");
      } catch (err) { showToast("خطأ: تعذر إلغاء الحظر."); }
    });
  }

  onAuthStateChanged(auth, async (user) => {
    currentUser = user;
    if (!user) {
      currentProfile = null;
      authMode = "login";
      renderAuthScreen();
      document.body.classList.remove("app-active");
      return;
    }
    try {
      const userRef = doc(db, "users", user.uid);
      const snap = await getDoc(userRef);
      if (snap.exists()) {
        currentProfile = snap.data();
        if (currentProfile.isBanned) {
          alert("تم طردك وحظرك من استخدام التطبيق لسوء الاستخدام.");
          await signOut(auth);
          return;
        }
      } else {
        // إنشاء ملف المستند تلقائياً إذا كانت القاعدة فارغة جديدة
        currentProfile = {
          username: user.displayName || user.email.split('@')[0],
          displayName: user.displayName || "مستخدم جديد",
          avatarUrl: "",
          bio: "",
          isBanned: false,
          isAdmin: false,
          createdAt: serverTimestamp()
        };
        await setDoc(userRef, currentProfile);
      }
    } catch (e) {
      currentProfile = { username: user.displayName || "user", displayName: user.displayName || "مستخدم", avatarUrl: "", bio: "", isBanned: false, isAdmin: false };
    }
    document.body.classList.add("app-active");
    renderShell();
  });

  wireComposer();
  wireModals();
</script>

<script>
  const obs = new MutationObserver(() => {
    document.getElementById("main-tabbar").style.display =
      document.body.classList.contains("app-active") ? "flex" : "none";
  });
  obs.observe(document.body, { attributes: true, attributeFilter: ["class"] });
</script>

</body>
</html>
